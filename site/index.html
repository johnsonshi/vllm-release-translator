<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07090b" />
  <title>vLLM Pulse — What’s New in vLLM &amp; This Week in vLLM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090b;
      --surface-1: #0d1216;
      --surface-2: #121920;
      --surface-3: #18222c;
      --border: rgba(240, 246, 252, 0.09);
      --border-strong: rgba(240, 246, 252, 0.18);
      --text: #f3f7fa;
      --muted: #9fb0c2;
      --dim: #687a8f;
      --lime: #d7f23a;
      --lime-bg: rgba(215, 242, 58, 0.10);
      --lime-border: rgba(215, 242, 58, 0.35);
      --cyan: #54e8d4;
      --cyan-bg: rgba(84, 232, 212, 0.10);
      --cyan-border: rgba(84, 232, 212, 0.32);
      --green: #3ddc84;
      --green-bg: rgba(61, 220, 132, 0.11);
      --green-border: rgba(61, 220, 132, 0.35);
      --amber: #f5a623;
      --amber-bg: rgba(245, 166, 35, 0.11);
      --amber-border: rgba(245, 166, 35, 0.35);
      --red: #ff6b6b;
      --red-bg: rgba(255, 107, 107, 0.10);
      --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      font-style: normal;
    }

    @media (pointer: fine) {
      html {
        overscroll-behavior: none;
      }
    }

    body {
      margin: 0;
      background-color: var(--bg);
      background-image:
        radial-gradient(85% 50% at 80% -10%, rgba(84, 232, 212, 0.08), transparent 60%),
        radial-gradient(65% 45% at 15% 0%, rgba(215, 242, 58, 0.06), transparent 60%);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    ::selection {
      background: var(--lime);
      color: #07090b;
    }

    .skip-link {
      position: absolute;
      top: -48px;
      left: 16px;
      background: var(--lime);
      color: #07090b;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 6px;
      z-index: 100;
      text-decoration: none;
      transition: top 150ms ease;
    }
    .skip-link:focus-visible {
      top: 12px;
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    a {
      color: var(--cyan);
      text-decoration: none;
      transition: color 140ms ease;
    }
    a:hover {
      color: var(--lime);
      text-decoration: underline;
    }

    button {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
    }

    h1, h2, h3, h4 {
      margin: 0;
      text-wrap: balance;
      letter-spacing: -0.028em;
      scroll-margin-top: 96px;
    }

    .num {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    /* TOP PUBLICATION NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 9, 11, 0.88);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .navbar-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .project-switcher {
      display: inline-flex;
      background: var(--surface-1);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }

    .proj-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .proj-btn:hover {
      color: var(--text);
    }
    .proj-btn[aria-pressed="true"] {
      background: var(--lime);
      color: #07090b;
    }

    .brand-tagline {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .mode-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn {
      appearance: none;
      background: var(--surface-1);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .mode-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .mode-btn[aria-current="page"] {
      background: var(--cyan-bg);
      border-color: var(--cyan-border);
      color: var(--cyan);
    }

    .mode-badge {
      font-family: var(--mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
    }

    /* VERSION BAR (UNDER NAVBAR IN RELEASE MODE) */
    .version-bar {
      background: var(--surface-1);
      border-bottom: 1px solid var(--border);
    }

    .version-bar-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 10px 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }

    .version-bar-label {
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--dim);
      margin-right: 4px;
      white-space: nowrap;
    }

    .ver-pill {
      appearance: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .ver-pill:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .ver-pill[aria-current="true"] {
      background: var(--lime-bg);
      border-color: var(--lime-border);
      color: var(--lime);
    }

    /* MAIN EDITORIAL CONTAINER */
    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 36px 28px 96px;
    }

    /* RELEASE ARTICLE LAYOUT (MAIN + STICKY RIGHT TOC) */
    .article-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 44px;
      align-items: start;
    }

    /* HERO HEADER */
    .article-hero {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--muted);
    }

    .pill-badge {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .tone-green {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
    }
    .tone-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }
    .tone-cyan {
      background: var(--cyan-bg);
      color: var(--cyan);
      border: 1px solid var(--cyan-border);
    }
    .tone-lime {
      background: var(--lime-bg);
      color: var(--lime);
      border: 1px solid var(--lime-border);
    }

    .hero-title {
      font-size: clamp(1.9rem, 3.4vw, 2.75rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.035em;
      margin-bottom: 18px;
    }

    .exec-summary-box {
      background: var(--surface-1);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--lime);
      border-radius: 10px;
      padding: 18px 22px;
      font-size: 1.01rem;
      color: #dce6f0;
      line-height: 1.65;
    }
    .exec-summary-label {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--lime);
      margin-bottom: 6px;
      display: block;
    }

    /* 5-PART SECTIONS */
    .editorial-section {
      padding: 32px 0;
      border-bottom: 1px solid var(--border);
    }
    .editorial-section:last-child {
      border-bottom: none;
    }

    .sec-kicker {
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--lime);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
      display: block;
    }

    .sec-title {
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sec-desc {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 22px;
    }

    /* PART 1: SYSDIG-STYLE FEATURE DEEP-DIVE CARDS */
    .feature-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .feature-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 140ms ease;
    }
    .feature-card:hover {
      border-color: var(--border-strong);
    }

    .feature-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .feature-card-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--text);
    }

    .feature-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .before-now-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .before-box, .now-box {
      border-radius: 9px;
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.58;
    }

    .before-box {
      background: rgba(255, 107, 107, 0.05);
      border: 1px solid rgba(255, 107, 107, 0.18);
      color: var(--muted);
    }

    .now-box {
      background: rgba(61, 220, 132, 0.06);
      border: 1px solid rgba(61, 220, 132, 0.22);
      color: var(--text);
    }

    .box-tag {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      display: block;
    }
    .before-box .box-tag { color: var(--red); }
    .now-box .box-tag { color: var(--green); }

    .code-block {
      margin: 0;
      background: #050709;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 16px;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: #d2e3f3;
      overflow-x: auto;
      line-height: 1.5;
    }

    /* PART 2 & PART 4 TABLES */
    .table-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 11px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    th {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--surface-2);
    }

    /* PART 3: JARGON CARDS */
    .jargon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
    }

    .jargon-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .jargon-term {
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .jargon-plain {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .jargon-takeaway {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 0.84rem;
      color: var(--text);
    }
    .jargon-takeaway strong {
      color: var(--lime);
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      margin-right: 6px;
    }

    /* PART 5: BENCHMARK PROOF BARS */
    .bench-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bench-row {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }

    .bench-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .bench-title {
      font-weight: 700;
      font-size: 0.96rem;
    }

    .bench-hw {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .bench-gain {
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--lime);
      font-variant-numeric: tabular-nums;
    }

    .bench-track {
      height: 8px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
    }

    .bench-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--lime));
      border-radius: 999px;
    }

    /* STICKY RIGHT TOC */
    .toc-box {
      position: sticky;
      top: 86px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 18px;
    }

    .toc-heading {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--dim);
      margin-bottom: 12px;
    }

    .toc-links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.84rem;
    }

    .toc-links a {
      color: var(--muted);
      display: block;
      padding: 4px 0;
    }
    .toc-links a:hover {
      color: var(--lime);
      text-decoration: none;
    }

    /* WEEKLY DIGEST (LWKD STYLE) */
    .tldr-3col {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .tldr-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-top: 3px solid var(--cyan);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    code {
      font-family: var(--mono);
      font-size: 0.84em;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 5px;
      border-radius: 4px;
      color: #e4f2ff;
    }

    .article-grid > *,
    .before-now-grid > *,
    .tldr-3col > *,
    .jargon-grid > *,
    .feature-card {
      min-width: 0;
    }

    @media (max-width: 1024px) {
      .navbar {
        position: relative;
        background: var(--bg);
      }
      .article-grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .toc-box {
        display: none;
      }
      .before-now-grid, .tldr-3col {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="live-announcer" class="sr-only" aria-live="polite"></div>

  <!-- TOP PUBLICATION NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="brand-left">
        <div class="project-switcher" role="group" aria-label="Switch project">
          <button type="button" class="proj-btn" id="proj-vllm" onclick="switchProject('vllm')" aria-pressed="true">
            vLLM Pulse
          </button>
          <button type="button" class="proj-btn" id="proj-kubernetes" onclick="switchProject('kubernetes')" aria-pressed="false">
            KubePulse (K8s)
          </button>
        </div>
        <div class="brand-tagline" id="brand-tagline">
          What changed in vLLM — for the models you serve, the GPUs you own, and your inference bill.
        </div>
      </div>

      <nav class="mode-tabs" aria-label="Publication format">
        <button type="button" class="mode-btn" id="mode-releases" onclick="switchMode('releases')" aria-current="page">
          <span>What’s New by Release</span>
          <span class="mode-badge">Sysdig / Versionlog Style</span>
        </button>
        <button type="button" class="mode-btn" id="mode-weekly" onclick="switchMode('weekly')">
          <span id="weekly-tab-label">This Week in vLLM</span>
          <span class="mode-badge">LWKD Weekly Style</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- VERSION SELECTOR BAR -->
  <nav class="version-bar" id="version-bar" aria-label="Release versions">
    <div class="version-bar-inner" id="version-bar-inner"></div>
  </nav>

  <!-- MAIN READER CONTENT -->
  <main class="container" id="main-content" tabindex="-1"></main>

  <script src="publication_data.js"></script>
  <script>
    const PUB = window.__PUBLICATION_DATA__ || {};

    let state = {
      project: 'vllm',
      mode: 'releases', // 'releases' | 'weekly'
      version: 'v0.34.0'
    };

    function readUrl() {
      const p = new URLSearchParams(window.location.search);
      const proj = p.get('project');
      if (proj === 'vllm' || proj === 'kubernetes') state.project = proj;
      const mode = p.get('mode');
      if (mode === 'releases' || mode === 'weekly') state.mode = mode;
      const ver = p.get('ver');
      if (ver) state.version = ver;
    }

    function syncUrl() {
      const p = new URLSearchParams();
      p.set('project', state.project);
      p.set('mode', state.mode);
      if (state.mode === 'releases') p.set('ver', state.version);
      window.history.replaceState(null, '', `${window.location.pathname}?${p.toString()}`);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatInline(str, project) {
      if (!str) return '';
      const repo = project === 'kubernetes' ? 'kubernetes/kubernetes' : 'vllm-project/vllm';
      let out = escapeHtml(str);
      out = out.replace(/`([^`]+)`/g, '<code translate="no">$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
      out = out.replace(/(?<![\/a-zA-Z0-9])#(\d{4,6})\b/g, `<a class="num" href="https://github.com/${repo}/pull/$1" target="_blank" rel="noopener">#$1</a>`);
      out = out.replace(/\bKEP-(\d{3,5})\b/gi, '<a class="num" href="https://github.com/kubernetes/enhancements/issues/$1" target="_blank" rel="noopener">KEP-$1</a>');
      return out;
    }

    function formatPrBadge(ref, project) {
      const repo = project === 'kubernetes' ? 'kubernetes/kubernetes' : 'vllm-project/vllm';
      if (String(ref).toUpperCase().startsWith('KEP-')) {
        const num = ref.replace(/[^0-9]/g, '');
        return `<a class="pill-badge tone-cyan num" href="https://github.com/kubernetes/enhancements/issues/${num}" target="_blank" rel="noopener">${escapeHtml(ref)}</a>`;
      }
      const num = String(ref).replace('#', '');
      return `<a class="pill-badge tone-cyan num" href="https://github.com/${repo}/pull/${num}" target="_blank" rel="noopener">#${escapeHtml(num)}</a>`;
    }

    function switchProject(proj) {
      state.project = proj;
      const projObj = PUB[proj];
      if (projObj && projObj.releases && projObj.releases.length > 0) {
        state.version = projObj.releases[0].version;
      }
      syncUrl();
      renderPage();
    }

    function switchMode(mode) {
      state.mode = mode;
      syncUrl();
      renderPage();
    }

    function selectVersion(ver) {
      state.version = ver;
      syncUrl();
      renderPage();
    }

    function renderReleaseArticle(projObj, rel) {
      const fp = rel.five_parts;
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';

      return `
        <div class="article-grid">
          <article>
            <header class="article-hero">
              <div class="hero-meta">
                <span class="pill-badge tone-lime">${escapeHtml(rel.badge)}</span>
                <span>Released ${escapeHtml(rel.date)}</span>
                <span>·</span>
                <span>${escapeHtml(rel.stats)}</span>
              </div>
              <h1 class="hero-title">What’s New in ${projName} ${escapeHtml(rel.version)}: ${escapeHtml(rel.headline)}</h1>
              <div class="exec-summary-box">
                <span class="exec-summary-label">Executive Summary // At a Glance</span>
                ${formatInline(rel.executive_summary, state.project)}
              </div>
            </header>

            <!-- PART 1 -->
            <section class="editorial-section" id="sec-big-deal" aria-labelledby="h-big-deal">
              <span class="sec-kicker">Part 01 // What Changed &amp; Why It Matters</span>
              <h2 class="sec-title" id="h-big-deal">1. What’s the Big Deal?</h2>
              <p class="sec-desc">The headline architectural changes in ${projName} ${escapeHtml(rel.version)}, explained without assuming you follow upstream PRs full-time.</p>

              <div class="feature-stack">
                ${fp.big_deal.map(item => `
                  <div class="feature-card">
                    <div class="feature-card-head">
                      <h3 class="feature-card-title">${escapeHtml(item.title)}</h3>
                      <div class="feature-badges">
                        <span class="pill-badge tone-${item.status_tone || 'green'}">${escapeHtml(item.status)}</span>
                        ${(item.prs || []).map(p => formatPrBadge(p, state.project)).join('')}
                      </div>
                    </div>

                    <div class="before-now-grid">
                      <div class="before-box">
                        <span class="box-tag">Before ${escapeHtml(rel.version)}</span>
                        ${formatInline(item.before, state.project)}
                      </div>
                      <div class="now-box">
                        <span class="box-tag">Now in ${escapeHtml(rel.version)}</span>
                        ${formatInline(item.now, state.project)}
                      </div>
                    </div>

                    ${item.config_snippet ? `<pre class="code-block"><code translate="no">${escapeHtml(item.config_snippet)}</code></pre>` : ''}
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- PART 2 -->
            <section class="editorial-section" id="sec-who-benefits" aria-labelledby="h-who-benefits">
              <span class="sec-kicker">Part 02 // Models, Hardware &amp; Unit Economics</span>
              <h2 class="sec-title" id="h-who-benefits">2. Who Benefits? (Models, GPUs &amp; Your Bill)</h2>
              <p class="sec-desc">How ${projName} ${escapeHtml(rel.version)} affects the models/workloads you serve, the GPUs/nodes you own, and your infrastructure spend.</p>

              <div class="table-card">
                <table>
                  <thead>
                    <tr>
                      <th scope="col" style="width:22%;">Team / Workload Profile</th>
                      <th scope="col" style="width:26%;">Models / Workloads</th>
                      <th scope="col" style="width:24%;">GPUs / Hardware</th>
                      <th scope="col" style="width:28%;">Impact on Your Bill &amp; Latency</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${fp.who_benefits.map(w => `
                      <tr>
                        <td><strong>${escapeHtml(w.persona)}</strong></td>
                        <td>${formatInline(w.models, state.project)}</td>
                        <td>${formatInline(w.gpus, state.project)}</td>
                        <td style="color:var(--lime); font-weight:500;">${formatInline(w.impact, state.project)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </section>

            <!-- PART 3 -->
            <section class="editorial-section" id="sec-jargon" aria-labelledby="h-jargon">
              <span class="sec-kicker">Part 03 // Plain-English Glossary</span>
              <h2 class="sec-title" id="h-jargon">3. What Does the Jargon Mean?</h2>
              <p class="sec-desc">Quick translations for the inference and systems terms introduced in this release.</p>

              <div class="jargon-grid">
                ${fp.jargon_decoded.map(j => `
                  <div class="jargon-card">
                    <div class="jargon-term" translate="no">${escapeHtml(j.term)}</div>
                    <div class="jargon-plain">${formatInline(j.plain_english, state.project)}</div>
                    <div class="jargon-takeaway">
                      <strong>Bottom Line:</strong> ${formatInline(j.bottom_line, state.project)}
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- PART 4 -->
            <section class="editorial-section" id="sec-upgrade" aria-labelledby="h-upgrade">
              <span class="sec-kicker">Part 04 // Adoption &amp; Migration Checklist</span>
              <h2 class="sec-title" id="h-upgrade">4. Should I Upgrade?</h2>
              <p class="sec-desc">Breaking changes, removed flags, and what to update in your deployment manifests before rolling out ${escapeHtml(rel.version)}.</p>

              <div class="exec-summary-box" style="margin-bottom:18px; border-left-color:var(--amber);">
                <span class="exec-summary-label" style="color:var(--amber);">Upgrade Verdict</span>
                <strong>${escapeHtml(fp.upgrade_guide.verdict)}</strong>
              </div>

              <div class="table-card">
                <table>
                  <thead>
                    <tr>
                      <th scope="col" style="width:26%;">What Changed</th>
                      <th scope="col" style="width:34%;">Operational Impact</th>
                      <th scope="col" style="width:30%;">What You Need to Do</th>
                      <th scope="col" style="width:10%;">Ref</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${fp.upgrade_guide.rows.map(r => `
                      <tr>
                        <td><strong>${formatInline(r.change, state.project)}</strong></td>
                        <td>${formatInline(r.impact, state.project)}</td>
                        <td style="color:var(--cyan);">${formatInline(r.action, state.project)}</td>
                        <td class="num">${formatPrBadge(r.pr, state.project)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </section>

            <!-- PART 5 -->
            <section class="editorial-section" id="sec-proof" aria-labelledby="h-proof">
              <span class="sec-kicker">Part 05 // Quantified Benchmarks &amp; Upstream PRs</span>
              <h2 class="sec-title" id="h-proof">5. Where’s the Proof?</h2>
              <p class="sec-desc">Measured throughput, latency, and capacity gains from upstream benchmarks with hardware conditions preserved.</p>

              <div class="bench-list">
                ${fp.proof_benchmarks.map(b => `
                  <div class="bench-row">
                    <div class="bench-top">
                      <div>
                        <div class="bench-title">${escapeHtml(b.label)}</div>
                        <div class="bench-hw">Hardware / Condition: ${escapeHtml(b.hardware)}</div>
                      </div>
                      <div style="display:flex; align-items:center; gap:10px;">
                        <span class="bench-gain">${escapeHtml(b.metric)}</span>
                        ${formatPrBadge(b.pr, state.project)}
                      </div>
                    </div>
                    <div class="bench-track">
                      <div class="bench-fill" style="width:${b.pct_bar || 80}%;"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          </article>

          <!-- STICKY 5-PART TABLE OF CONTENTS -->
          <aside class="toc-box" aria-label="On this page">
            <div class="toc-heading">5-Part Release Guide</div>
            <ul class="toc-links">
              <li><a href="#sec-big-deal">1. What’s the Big Deal?</a></li>
              <li><a href="#sec-who-benefits">2. Who Benefits? (Models, GPUs &amp; Bill)</a></li>
              <li><a href="#sec-jargon">3. What Does the Jargon Mean?</a></li>
              <li><a href="#sec-upgrade">4. Should I Upgrade?</a></li>
              <li><a href="#sec-proof">5. Where’s the Proof?</a></li>
            </ul>
            <div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--border); font-size:0.78rem; color:var(--muted);">
              Want the weekly commit digest instead?<br />
              <button
                type="button"
                onclick="switchMode('weekly')"
                style="margin-top:8px; width:100%; background:var(--cyan-bg); border:1px solid var(--cyan-border); color:var(--cyan); padding:7px 10px; border-radius:6px; font-weight:600; cursor:pointer;"
              >
                Read This Week in ${projName} →
              </button>
            </div>
          </aside>
        </div>
      `;
    }

    function renderWeeklyDigest(projObj) {
      const w = projObj.weekly;
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';

      return `
        <div>
          <header class="article-hero">
            <div class="hero-meta">
              <span class="pill-badge tone-cyan">${escapeHtml(w.issue_number)}</span>
              <span>${escapeHtml(w.date_range)}</span>
              <span>·</span>
              <span>${escapeHtml(w.reading_time)}</span>
            </div>
            <h1 class="hero-title">${escapeHtml(w.headline)}</h1>
            <div class="exec-summary-box" style="border-left-color:var(--cyan);">
              <span class="exec-summary-label" style="color:var(--cyan);">Weekly Digest // LWKD Style</span>
              ${escapeHtml(w.intro)}
            </div>
          </header>

          <section class="editorial-section">
            <span class="sec-kicker">Top 3 Takeaways This Week</span>
            <h2 class="sec-title" style="margin-bottom:18px;">What Merged &amp; Why You Care</h2>
            <div class="tldr-3col">
              ${w.tldr_cards.map(c => `
                <div class="tldr-card">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="pill-badge tone-lime">${escapeHtml(c.tag)}</span>
                    <div style="display:flex; gap:5px;">
                      ${(c.prs || []).map(p => formatPrBadge(p, state.project)).join('')}
                    </div>
                  </div>
                  <h3 style="font-size:1.05rem; font-weight:700;">${escapeHtml(c.title)}</h3>
                  <p style="margin:0; font-size:0.88rem; color:var(--muted);">${formatInline(c.summary, state.project)}</p>
                  <div style="margin-top:auto; padding-top:10px; border-top:1px dashed var(--border); font-size:0.83rem; color:var(--lime);">
                    <strong>Impact:</strong> ${formatInline(c.impact, state.project)}
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <section class="editorial-section">
            <span class="sec-kicker">Featured PRs of the Week</span>
            <h2 class="sec-title" style="margin-bottom:18px;">Deep Dives (Plain-English Translation)</h2>
            <div class="feature-stack">
              ${w.sections[0].items.map(it => `
                <div class="feature-card">
                  <div class="feature-card-head">
                    <h3 class="feature-card-title">${escapeHtml(it.title)}</h3>
                    ${formatPrBadge(it.pr, state.project)}
                  </div>
                  <div class="before-now-grid">
                    <div class="before-box" style="background:rgba(255,255,255,0.03); border-color:var(--border-strong);">
                      <span class="box-tag" style="color:var(--cyan);">What Changed Under the Hood</span>
                      ${formatInline(it.what_it_is, state.project)}
                    </div>
                    <div class="now-box">
                      <span class="box-tag">Why Operators Care</span>
                      ${formatInline(it.why_you_care, state.project)}
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <section class="editorial-section" style="border-bottom:none;">
            <span class="sec-kicker">15-Second Scan</span>
            <h2 class="sec-title" style="margin-bottom:14px;">${escapeHtml(w.sections[1].category)}</h2>
            <div class="feature-card">
              <ul style="margin:0; padding-left:20px; display:grid; gap:10px; font-size:0.93rem;">
                ${w.sections[1].bullets.map(b => `<li>${formatInline(b, state.project)}</li>`).join('')}
              </ul>
            </div>
          </section>
        </div>
      `;
    }

    function renderPage() {
      const projObj = PUB[state.project] || PUB.vllm;
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';

      document.getElementById('proj-vllm').setAttribute('aria-pressed', state.project === 'vllm' ? 'true' : 'false');
      document.getElementById('proj-kubernetes').setAttribute('aria-pressed', state.project === 'kubernetes' ? 'true' : 'false');
      document.getElementById('brand-tagline').textContent = projObj.tagline;
      document.getElementById('weekly-tab-label').textContent = `This Week in ${projName}`;

      const relBtn = document.getElementById('mode-releases');
      const wkBtn = document.getElementById('mode-weekly');
      if (state.mode === 'releases') {
        relBtn.setAttribute('aria-current', 'page');
        wkBtn.removeAttribute('aria-current');
      } else {
        wkBtn.setAttribute('aria-current', 'page');
        relBtn.removeAttribute('aria-current');
      }

      const verBar = document.getElementById('version-bar');
      const verInner = document.getElementById('version-bar-inner');
      const releases = projObj.releases || [];

      if (state.mode === 'releases') {
        verBar.style.display = 'block';
        if (!releases.some(r => r.version === state.version) && releases.length > 0) {
          state.version = releases[0].version;
        }
        verInner.innerHTML = `
          <span class="version-bar-label">Select ${projName} Version:</span>
          ${releases.map((r, i) => `
            <button
              type="button"
              class="ver-pill"
              aria-current="${r.version === state.version ? 'true' : 'false'}"
              onclick="selectVersion('${escapeHtml(r.version)}')"
            >
              <span>${escapeHtml(r.version)}</span>
              ${i === 0 ? '<span style="font-size:0.65rem; opacity:0.8;">LATEST</span>' : ''}
            </button>
          `).join('')}
        `;
      } else {
        verBar.style.display = 'none';
      }

      const mainEl = document.getElementById('main-content');
      if (state.mode === 'releases') {
        const activeRel = releases.find(r => r.version === state.version) || releases[0];
        mainEl.innerHTML = renderReleaseArticle(projObj, activeRel);
      } else {
        mainEl.innerHTML = renderWeeklyDigest(projObj);
      }
    }

    readUrl();
    renderPage();
  </script>
</body>
</html>

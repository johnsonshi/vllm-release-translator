<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
  <title>What’s New in vLLM — Release Notes for Operators (v0.1.0 – v0.34.0)</title>
  <style>
    :root,
    html[data-theme="light"] {
      color-scheme: light;
      --bs-body-bg: #ffffff;
      --bs-body-color: #212529;
      --bs-secondary-color: #495057;
      --bs-muted-color: #6c757d;
      --bs-tertiary-bg: #f8f9fa;
      --bs-border-color: #dee2e6;
      --bs-border-strong: #ced4da;
      --bs-primary: #0d6efd;
      --bs-primary-hover: #0a58ca;
      --bs-primary-subtle: #cfe2ff;
      --bs-primary-text: #084298;
      --bs-success-bg: #d1e7dd;
      --bs-success-text: #0f5132;
      --bs-warning-bg: #fff3cd;
      --bs-warning-text: #664d03;
      --bs-warning-border: #ffecb5;
      --bs-code-bg: #f8f9fa;
      --bs-font-sans-serif: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
      --bs-font-monospace: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bs-body-bg: #0d1117;
      --bs-body-color: #e6edf3;
      --bs-secondary-color: #b1bac4;
      --bs-muted-color: #8b949e;
      --bs-tertiary-bg: #161b22;
      --bs-border-color: #30363d;
      --bs-border-strong: #484f58;
      --bs-primary: #58a6ff;
      --bs-primary-hover: #79c0ff;
      --bs-primary-subtle: rgba(56, 139, 253, 0.18);
      --bs-primary-text: #79c0ff;
      --bs-success-bg: rgba(46, 160, 67, 0.2);
      --bs-success-text: #56d364;
      --bs-warning-bg: rgba(187, 128, 9, 0.18);
      --bs-warning-text: #e3b341;
      --bs-warning-border: rgba(187, 128, 9, 0.4);
      --bs-code-bg: #161b22;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      font-family: var(--bs-font-sans-serif);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .skip-link {
      position: absolute;
      top: -48px;
      left: 16px;
      background: var(--bs-primary);
      color: #ffffff;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 0.375rem;
      z-index: 100;
      text-decoration: none;
    }
    .skip-link:focus-visible {
      top: 10px;
      outline: 2px solid var(--bs-body-color);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    a {
      color: var(--bs-primary);
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }
    a:hover {
      color: var(--bs-primary-hover);
    }

    button, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--bs-primary);
      outline-offset: 2px;
    }

    h1, h2, h3, h4 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-family: var(--bs-font-sans-serif);
      font-weight: 700;
      line-height: 1.25;
      color: var(--bs-body-color);
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    /* BOOTSTRAP-STYLE NAVBAR */
    .navbar {
      background-color: var(--bs-tertiary-bg);
      border-bottom: 1px solid var(--bs-border-color);
      padding: 0.65rem 1rem;
    }

    .navbar-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .navbar-brand {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--bs-body-color);
      letter-spacing: -0.01em;
    }

    .btn-group {
      display: inline-flex;
      border: 1px solid var(--bs-border-strong);
      border-radius: 0.375rem;
      overflow: hidden;
      background-color: var(--bs-body-bg);
    }

    .btn-seg {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--bs-secondary-color);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
    }
    .btn-seg + .btn-seg {
      border-left: 1px solid var(--bs-border-strong);
    }
    .btn-seg:hover {
      background-color: var(--bs-tertiary-bg);
      color: var(--bs-body-color);
    }
    .btn-seg[aria-pressed="true"] {
      background-color: var(--bs-primary);
      color: #ffffff;
      font-weight: 600;
    }
    html[data-theme="dark"] .btn-seg[aria-pressed="true"] {
      color: #0d1117;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* BOOTSTRAP NAVBAR DROPDOWNS (OPEN ON HOVER OR CLICK) */
    .nav-menus {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-toggle {
      appearance: none;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border: 1px solid var(--bs-border-strong);
      border-radius: 0.375rem;
      padding: 0.34rem 0.75rem;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-variant-numeric: tabular-nums;
    }
    .dropdown-toggle:hover {
      background-color: var(--bs-tertiary-bg);
    }
    .dropdown-toggle.active {
      background-color: var(--bs-primary-subtle);
      color: var(--bs-primary-text);
      border-color: var(--bs-primary);
      font-weight: 600;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 2px;
      min-width: 225px;
      max-height: 360px;
      overflow-y: auto;
      background-color: var(--bs-body-bg);
      border: 1px solid var(--bs-border-strong);
      border-radius: 0.375rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      padding: 0.35rem 0;
      z-index: 60;
      list-style: none;
    }

    /* Bridge the 2px gap so hover doesn't close when moving cursor into menu */
    .dropdown::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 6px;
    }

    .dropdown:hover .dropdown-menu,
    .dropdown:focus-within .dropdown-menu,
    .dropdown.open .dropdown-menu {
      display: block;
    }

    .dropdown-header {
      padding: 0.25rem 0.85rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--bs-muted-color);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .dropdown-item {
      appearance: none;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--bs-body-color);
      padding: 0.42rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
      display: block;
      font-variant-numeric: tabular-nums;
    }
    .dropdown-item:hover {
      background-color: var(--bs-tertiary-bg);
    }
    .dropdown-item[aria-current="true"] {
      background-color: var(--bs-primary-subtle);
      color: var(--bs-primary-text);
      font-weight: 600;
    }

    .dropdown-date {
      font-size: 0.76rem;
      color: var(--bs-muted-color);
    }

    .btn-theme {
      appearance: none;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border: 1px solid var(--bs-border-strong);
      border-radius: 0.375rem;
      padding: 0.34rem 0.7rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn-theme:hover {
      background-color: var(--bs-tertiary-bg);
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem 5rem;
    }

    /* PAGE HEADER */
    .page-header {
      padding-bottom: 1.25rem;
      margin-bottom: 1.75rem;
      border-bottom: 1px solid var(--bs-border-color);
    }

    .page-meta {
      font-size: 0.875rem;
      color: var(--bs-muted-color);
      margin-bottom: 0.4rem;
      font-variant-numeric: tabular-nums;
    }

    .page-title {
      font-size: clamp(1.6rem, 3vw, 2.15rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .lead {
      font-size: 1.05rem;
      color: var(--bs-secondary-color);
      margin: 0;
      line-height: 1.65;
    }

    /* SECTIONS */
    .section-block {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--bs-border-color);
    }
    .section-block:last-child {
      border-bottom: none;
    }

    .section-block h2 {
      font-size: 1.3rem;
      margin-bottom: 0.25rem;
    }

    .section-subtitle {
      font-size: 0.92rem;
      color: var(--bs-muted-color);
      margin: 0 0 1.25rem 0;
    }

    /* PART 1 ITEMS */
    .feature-item + .feature-item {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--bs-border-color);
    }

    .feature-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 0.35rem 0;
    }

    .feature-prs {
      font-size: 0.85rem;
      color: var(--bs-muted-color);
      margin: 0 0 0.5rem 0;
      font-variant-numeric: tabular-nums;
    }

    .feature-p {
      margin: 0 0 0.5rem 0;
      font-size: 0.95rem;
      color: var(--bs-secondary-color);
    }
    .feature-p strong {
      color: var(--bs-body-color);
    }

    pre.code-box {
      margin: 0.75rem 0 0 0;
      background-color: var(--bs-code-bg);
      border: 1px solid var(--bs-border-color);
      border-radius: 0.375rem;
      padding: 0.75rem 1rem;
      font-family: var(--bs-font-monospace);
      font-size: 0.8125rem;
      line-height: 1.5;
      color: var(--bs-body-color);
      overflow-x: auto;
    }

    /* BOOTSTRAP TABLES */
    .table-responsive {
      overflow-x: auto;
      border: 1px solid var(--bs-border-color);
      border-radius: 0.375rem;
    }

    table.table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      margin: 0;
    }

    .table th,
    .table td {
      padding: 0.65rem 0.85rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--bs-border-color);
    }

    .table tbody tr:last-child td {
      border-bottom: none;
    }

    .table th {
      background-color: var(--bs-tertiary-bg);
      font-weight: 600;
      color: var(--bs-body-color);
      font-size: 0.82rem;
    }

    /* JARGON LIST */
    dl.jargon-dl {
      margin: 0;
      display: grid;
      gap: 1rem;
    }

    .jargon-row {
      padding: 0.75rem 1rem;
      background-color: var(--bs-tertiary-bg);
      border: 1px solid var(--bs-border-color);
      border-radius: 0.375rem;
    }

    .jargon-row dt {
      font-family: var(--bs-font-monospace);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--bs-body-color);
      margin-bottom: 0.25rem;
    }

    .jargon-row dd {
      margin: 0;
      font-size: 0.92rem;
      color: var(--bs-secondary-color);
    }

    /* ALERT BOX */
    .alert-warning {
      background-color: var(--bs-warning-bg);
      color: var(--bs-warning-text);
      border: 1px solid var(--bs-warning-border);
      border-radius: 0.375rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }

    code {
      font-family: var(--bs-font-monospace);
      font-size: 0.85em;
      background-color: var(--bs-code-bg);
      border: 1px solid var(--bs-border-color);
      padding: 0.1rem 0.3rem;
      border-radius: 0.25rem;
      color: var(--bs-body-color);
    }
    pre code {
      background: none;
      border: none;
      padding: 0;
    }

    .merge-list {
      margin: 0;
      padding-left: 1.25rem;
      display: grid;
      gap: 0.5rem;
      font-size: 0.94rem;
      color: var(--bs-secondary-color);
    }
    .pager-bar {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--bs-border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-pager {
      appearance: none;
      background-color: var(--bs-body-bg);
      color: var(--bs-primary);
      border: 1px solid var(--bs-border-strong);
      border-radius: 0.375rem;
      padding: 0.45rem 0.9rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .btn-pager:hover {
      background-color: var(--bs-tertiary-bg);
      color: var(--bs-primary-hover);
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="navbar-container">
      <div class="navbar-left">
        <span class="navbar-brand">What’s New in vLLM</span>

        <nav class="nav-menus" aria-label="vLLM release selector">
          <div class="dropdown" id="dd-releases">
            <button type="button" class="dropdown-toggle active" id="btn-dd-releases" onclick="toggleDropdown('dd-releases')">
              <span id="lbl-dd-releases">Releases (v0.34.0)</span>
              <span aria-hidden="true">▾</span>
            </button>
            <ul class="dropdown-menu" id="menu-releases"></ul>
          </div>
        </nav>
      </div>

      <div class="navbar-right">
        <button type="button" class="btn-theme" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle light or dark theme">
          <span id="theme-toggle-label">Dark mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container" id="main-content" tabindex="-1"></main>

  <script src="publication_data.js"></script>
  <script>
    const PUB = window.__PUBLICATION_DATA__ || {};

    let state = {
      version: 'v0.34.0',
      theme: localStorage.getItem('release_theme') || 'light'
    };

    function toggleDropdown(ddId) {
      const el = document.getElementById(ddId);
      if (!el) return;
      const isOpen = el.classList.contains('open');
      document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
      if (!isOpen) el.classList.add('open');
    }

    function closeDropdowns() {
      document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
      }
    });

    function applyTheme(theme) {
      state.theme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', state.theme);
      localStorage.setItem('release_theme', state.theme);
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) {
        metaTheme.setAttribute('content', state.theme === 'dark' ? '#0d1117' : '#ffffff');
      }
      const lbl = document.getElementById('theme-toggle-label');
      if (lbl) {
        lbl.textContent = state.theme === 'dark' ? 'Light mode' : 'Dark mode';
      }
    }

    function toggleTheme() {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    }

    function readUrl() {
      const p = new URLSearchParams(window.location.search);
      const ver = p.get('ver');
      if (ver) state.version = ver;
    }

    function syncUrl() {
      const p = new URLSearchParams();
      p.set('ver', state.version);
      window.history.replaceState(null, '', `${window.location.pathname}?${p.toString()}`);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatProse(str) {
      if (!str) return '';
      let out = escapeHtml(str);
      out = out.replace(/`([^`]+)`/g, '<code translate="no">$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
      out = out.replace(/(?<![\/a-zA-Z0-9])#(\d{1,6})\b/g, '<a class="num" href="https://github.com/vllm-project/vllm/pull/$1" target="_blank" rel="noopener">#$1</a>');
      return out;
    }

    function formatRefLink(ref) {
      const num = String(ref).replace('#', '');
      if (/^\d+$/.test(num)) {
        return `<a class="num" href="https://github.com/vllm-project/vllm/pull/${num}" target="_blank" rel="noopener">#${escapeHtml(num)}</a>`;
      }
      return `<span class="num">${escapeHtml(ref)}</span>`;
    }

    function selectVersion(ver) {
      state.version = ver;
      closeDropdowns();
      syncUrl();
      render();
      window.scrollTo(0, 0);
    }

    function renderNavigation(releases) {
      const lblRel = document.getElementById('lbl-dd-releases');
      lblRel.textContent = `Releases (${state.version})`;

      document.getElementById('menu-releases').innerHTML = `
        <li class="dropdown-header">All 34 vLLM Releases (v0.1.0 – v0.34.0)</li>
        ${releases.map((r, i) => `
          <li>
            <button
              type="button"
              class="dropdown-item"
              aria-current="${state.version === r.version ? 'true' : 'false'}"
              onclick="selectVersion('${escapeHtml(r.version)}')"
            >
              <span translate="no">${escapeHtml(r.version)}</span> <span class="dropdown-date">(${escapeHtml(r.date)}${i === 0 ? ', latest' : (r.version === 'v0.1.0' ? ', initial' : '')})</span>
            </button>
          </li>
        `).join('')}
      `;
    }

    function renderReleaseView(releases, rel) {
      const fp = rel.five_parts;
      const ghTag = rel.version === 'v0.33.0' ? 'v0.33.0rc3' : rel.version;

      return `
        <article>
          <header class="page-header">
            <div class="page-meta">
              Released on ${escapeHtml(rel.date)} (<a href="https://github.com/vllm-project/vllm/releases/tag/${escapeHtml(ghTag)}" target="_blank" rel="noopener">GitHub release</a> with ${escapeHtml(rel.stats)}).
            </div>
            <h1 class="page-title">What’s New in vLLM ${escapeHtml(rel.version)}: ${escapeHtml(rel.headline)}</h1>
            <p class="lead">${formatProse(rel.executive_summary)}</p>
          </header>

          <section class="section-block" id="whats-the-big-deal">
            <h2>1. What’s the big deal?</h2>
            <p class="section-subtitle">The headline changes in vLLM ${escapeHtml(rel.version)} and what they replace.</p>

            <div>
              ${fp.big_deal.map(item => `
                <div class="feature-item">
                  <h3 class="feature-title">${escapeHtml(item.title)}</h3>
                  ${(item.prs && item.prs.length) ? `<p class="feature-prs">Pull requests: ${item.prs.map(p => formatRefLink(p)).join(', ')}</p>` : ''}
                  <p class="feature-p"><strong>Previously:</strong> ${formatProse(item.before)}</p>
                  <p class="feature-p"><strong>Now in ${escapeHtml(rel.version)}:</strong> ${formatProse(item.now)}</p>
                  ${item.config_snippet ? `<pre class="code-box"><code translate="no">${escapeHtml(item.config_snippet)}</code></pre>` : ''}
                </div>
              `).join('')}
            </div>
          </section>

          <section class="section-block" id="who-benefits">
            <h2>2. Who benefits? (Models, GPUs &amp; Your Bill)</h2>
            <p class="section-subtitle">Which models, hardware fleets, and workloads benefit from ${escapeHtml(rel.version)}.</p>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col" style="width:23%;">Workload / Team</th>
                    <th scope="col" style="width:26%;">Models / Services</th>
                    <th scope="col" style="width:23%;">GPUs / Hardware</th>
                    <th scope="col" style="width:28%;">Impact on Bill &amp; Latency</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.who_benefits.map(w => `
                    <tr>
                      <td><strong>${escapeHtml(w.persona)}</strong></td>
                      <td>${formatProse(w.models)}</td>
                      <td>${formatProse(w.gpus)}</td>
                      <td>${formatProse(w.impact)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>

          <section class="section-block" id="jargon-glossary">
            <h2>3. What does the jargon mean?</h2>
            <p class="section-subtitle">Plain-English definitions for the systems and inference terms in this release.</p>

            <dl class="jargon-dl">
              ${fp.jargon_decoded.map(j => `
                <div class="jargon-row">
                  <dt translate="no">${escapeHtml(j.term)}</dt>
                  <dd>
                    <div>${formatProse(j.plain_english)}</div>
                    <div style="margin-top:0.3rem;"><strong>Why it matters:</strong> ${formatProse(j.bottom_line)}</div>
                  </dd>
                </div>
              `).join('')}
            </dl>
          </section>

          <section class="section-block" id="should-i-upgrade">
            <h2>4. Should I upgrade?</h2>
            <p class="section-subtitle">Breaking changes, deprecated flags, and configuration updates to check before upgrading.</p>

            <div class="alert-warning">
              <strong>Verdict:</strong> ${escapeHtml(fp.upgrade_guide.verdict)}
            </div>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col" style="width:26%;">Change</th>
                    <th scope="col" style="width:34%;">What Breaks or Changes</th>
                    <th scope="col" style="width:30%;">Required Action</th>
                    <th scope="col" style="width:10%;">PR</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.upgrade_guide.rows.map(r => `
                    <tr>
                      <td><strong>${formatProse(r.change)}</strong></td>
                      <td>${formatProse(r.impact)}</td>
                      <td>${formatProse(r.action)}</td>
                      <td class="num">${formatRefLink(r.pr)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>

          <section class="section-block" id="wheres-the-proof">
            <h2>5. Where’s the proof?</h2>
            <p class="section-subtitle">Benchmarks and upstream pull requests with hardware and model conditions preserved.</p>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col" style="width:36%;">Benchmark / Capability</th>
                    <th scope="col" style="width:32%;">Hardware &amp; Workload Condition</th>
                    <th scope="col" style="width:22%;">Measured Gain</th>
                    <th scope="col" style="width:10%;">Source</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.proof_benchmarks.map(b => `
                    <tr>
                      <td><strong>${escapeHtml(b.label)}</strong></td>
                      <td>${escapeHtml(b.hardware)}</td>
                      <td class="num"><strong>${escapeHtml(b.metric)}</strong></td>
                      <td class="num">${formatRefLink(b.pr)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>
        </article>
      `;
    }

    function render() {
      const projObj = PUB.vllm || {};
      const releases = projObj.releases || [];
      if (!releases.some(r => r.version === state.version) && releases.length > 0) {
        state.version = releases[0].version;
      }

      renderNavigation(releases);

      const mainEl = document.getElementById('main-content');
      const activeRel = releases.find(r => r.version === state.version) || releases[0];
      mainEl.innerHTML = renderReleaseView(releases, activeRel);
    }

    readUrl();
    applyTheme(state.theme);
    render();
  </script>
</body>
</html>

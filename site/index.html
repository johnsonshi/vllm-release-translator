<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>What’s New in vLLM &amp; Kubernetes — Release Notes for Operators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f6f8fa;
      --bg-callout: #f0f5ff;
      --bg-warn: #fff8eb;
      --ink: #111827;
      --ink-secondary: #374151;
      --ink-muted: #6b7280;
      --rule: #e5e7eb;
      --rule-strong: #d1d5db;
      --blue: #1d4ed8;
      --blue-hover: #1e40af;
      --green-ink: #065f46;
      --green-bg: #ecfdf5;
      --amber-ink: #92400e;
      --amber-bg: #fef3c7;
      --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .skip-link {
      position: absolute;
      top: -48px;
      left: 16px;
      background: var(--blue);
      color: #ffffff;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 4px;
      z-index: 100;
      text-decoration: none;
    }
    .skip-link:focus-visible {
      top: 12px;
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    a {
      color: var(--blue);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    a:hover {
      color: var(--blue-hover);
      text-decoration-thickness: 2px;
    }

    button {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    h1, h2, h3, h4 {
      margin: 0;
      color: var(--ink);
      text-wrap: balance;
      scroll-margin-top: 24px;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    /* TOP MASTHEAD */
    .site-header {
      border-bottom: 1px solid var(--rule);
      background: var(--bg);
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }

    .site-title {
      font-family: var(--serif);
      font-size: 1.85rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1;
    }

    .project-nav {
      display: inline-flex;
      gap: 4px;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--rule);
    }

    .proj-switch {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .proj-switch:hover {
      color: var(--ink);
    }
    .proj-switch[aria-pressed="true"] {
      background: var(--bg);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .format-nav {
      display: flex;
      gap: 20px;
      align-items: baseline;
    }

    .format-link {
      appearance: none;
      border: none;
      background: transparent;
      padding: 4px 0;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--ink-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .format-link:hover {
      color: var(--ink);
    }
    .format-link[aria-current="page"] {
      color: var(--ink);
      font-weight: 600;
      border-bottom-color: var(--blue);
    }

    /* COMPACT EDITION STRIP */
    .edition-strip {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--rule);
    }

    .edition-strip-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 9px 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .edition-strip-inner::-webkit-scrollbar {
      display: none;
    }

    .strip-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-muted);
      margin-right: 4px;
      white-space: nowrap;
    }

    .ver-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--ink-secondary);
      cursor: pointer;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .ver-btn:hover {
      background: var(--bg);
      border-color: var(--rule);
      color: var(--ink);
    }
    .ver-btn[aria-current="true"] {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
      font-weight: 600;
    }

    .strip-divider {
      width: 1px;
      height: 16px;
      background: var(--rule-strong);
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* SINGLE EDITORIAL READING COLUMN */
    .layout {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 24px 96px;
    }

    .jump-nav {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 0.85rem;
    }
    .jump-label {
      font-weight: 600;
      color: var(--ink-muted);
    }

    /* ARTICLE PROSE */
    article {
      min-width: 0;
    }

    .article-header {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 28px;
    }

    .article-byline {
      font-size: 0.88rem;
      color: var(--ink-muted);
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }

    .article-title {
      font-family: var(--serif);
      font-size: clamp(2.15rem, 3.8vw, 2.85rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.015em;
      margin-bottom: 16px;
    }

    .article-standfirst {
      font-size: 1.08rem;
      line-height: 1.65;
      color: var(--ink-secondary);
      margin: 0;
    }

    /* SECTIONS */
    .doc-section {
      padding: 28px 0;
      border-bottom: 1px solid var(--rule);
    }
    .doc-section:last-child {
      border-bottom: none;
    }

    .doc-section h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .section-lead {
      font-size: 0.94rem;
      color: var(--ink-muted);
      margin: 0 0 22px 0;
    }

    /* PART 1: EDITORIAL ENTRIES (NO BOX SOUP) */
    .change-entry + .change-entry {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--rule);
    }

    .change-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .change-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--ink);
    }

    .change-refs {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }

    .stage-tag {
      font-family: var(--sans);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .stage-green {
      background: var(--green-bg);
      color: var(--green-ink);
    }
    .stage-amber {
      background: var(--amber-bg);
      color: var(--amber-ink);
    }
    .stage-blue {
      background: var(--bg-callout);
      color: var(--blue);
    }

    .change-prose {
      margin: 0 0 10px 0;
      color: var(--ink-secondary);
      font-size: 0.96rem;
    }
    .change-prose strong {
      color: var(--ink);
      font-weight: 600;
    }

    pre.code-sample {
      margin: 14px 0 0 0;
      background: var(--bg-subtle);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 12px 15px;
      font-family: var(--mono);
      font-size: 0.81rem;
      line-height: 1.55;
      color: var(--ink);
      overflow-x: auto;
    }

    /* TABLES */
    .table-scroll {
      overflow-x: auto;
      border-top: 1px solid var(--rule-strong);
      border-bottom: 1px solid var(--rule-strong);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 11px 12px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--rule);
    }

    tr:last-child td {
      border-bottom: none;
    }

    th {
      font-weight: 600;
      color: var(--ink);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--rule-strong);
      font-size: 0.82rem;
    }

    /* PART 3: DEFINITION LIST FOR JARGON */
    dl.glossary-list {
      margin: 0;
      display: grid;
      gap: 18px;
    }

    .glossary-item {
      padding-left: 14px;
      border-left: 2px solid var(--rule-strong);
    }

    .glossary-item dt {
      font-family: var(--mono);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .glossary-item dd {
      margin: 0;
      font-size: 0.93rem;
      color: var(--ink-secondary);
    }

    .glossary-why {
      margin-top: 4px;
      font-size: 0.88rem;
      color: var(--ink);
    }

    /* CALLOUT NOTE */
    .verdict-note {
      background: var(--bg-warn);
      border-left: 3px solid #d97706;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.93rem;
      color: var(--ink);
    }

    code {
      font-family: var(--mono);
      font-size: 0.85em;
      background: var(--bg-subtle);
      border: 1px solid var(--rule);
      padding: 1px 4px;
      border-radius: 3px;
      color: var(--ink);
    }
    pre code {
      background: none;
      border: none;
      padding: 0;
    }

    /* WEEKLY DIGEST LIST */
    .weekly-list {
      margin: 0;
      padding-left: 20px;
      display: grid;
      gap: 9px;
      font-size: 0.95rem;
      color: var(--ink-secondary);
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
        padding-top: 20px;
      }
      .spine {
        position: static;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 18px;
      }
      .version-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ver-btn {
        width: auto;
        border: 1px solid var(--rule);
      }
      .ver-date {
        display: none;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="site-title" id="site-title">What’s New in vLLM</div>
      <div class="project-nav" role="group" aria-label="Select project">
        <button type="button" class="proj-switch" id="btn-proj-vllm" onclick="switchProject('vllm')" aria-pressed="true">
          vLLM
        </button>
        <button type="button" class="proj-switch" id="btn-proj-k8s" onclick="switchProject('kubernetes')" aria-pressed="false">
          Kubernetes
        </button>
      </div>
    </div>
  </header>

  <nav class="edition-strip" aria-label="Version and issue selector">
    <div class="edition-strip-inner" id="edition-strip-inner"></div>
  </nav>

  <div class="layout">
    <main id="main-content" tabindex="-1"></main>
  </div>

  <script src="publication_data.js"></script>
  <script>
    const PUB = window.__PUBLICATION_DATA__ || {};

    let state = {
      project: 'vllm',
      mode: 'releases',
      version: 'v0.34.0'
    };

    function readUrl() {
      const p = new URLSearchParams(window.location.search);
      const proj = p.get('project');
      if (proj === 'vllm' || proj === 'kubernetes') state.project = proj;
      const mode = p.get('mode');
      if (mode === 'releases' || mode === 'weekly') state.mode = mode;
      const ver = p.get('ver');
      if (ver) state.version = ver;
    }

    function syncUrl() {
      const p = new URLSearchParams();
      p.set('project', state.project);
      p.set('mode', state.mode);
      if (state.mode === 'releases') p.set('ver', state.version);
      window.history.replaceState(null, '', `${window.location.pathname}?${p.toString()}`);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatProse(str, project) {
      if (!str) return '';
      const repo = project === 'kubernetes' ? 'kubernetes/kubernetes' : 'vllm-project/vllm';
      let out = escapeHtml(str);
      out = out.replace(/`([^`]+)`/g, '<code translate="no">$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      out = out.replace(/(?<![\/a-zA-Z0-9])#(\d{4,6})\b/g, `<a class="num" href="https://github.com/${repo}/pull/$1" target="_blank" rel="noopener">#$1</a>`);
      out = out.replace(/\bKEP-(\d{3,5})\b/gi, '<a class="num" href="https://github.com/kubernetes/enhancements/issues/$1" target="_blank" rel="noopener">KEP-$1</a>');
      return out;
    }

    function formatRefLink(ref, project) {
      const repo = project === 'kubernetes' ? 'kubernetes/kubernetes' : 'vllm-project/vllm';
      if (String(ref).toUpperCase().startsWith('KEP-')) {
        const num = ref.replace(/[^0-9]/g, '');
        return `<a class="num" href="https://github.com/kubernetes/enhancements/issues/${num}" target="_blank" rel="noopener">${escapeHtml(ref)}</a>`;
      }
      const num = String(ref).replace('#', '');
      if (/^\d+$/.test(num)) {
        return `<a class="num" href="https://github.com/${repo}/pull/${num}" target="_blank" rel="noopener">#${escapeHtml(num)}</a>`;
      }
      return `<span class="num">${escapeHtml(ref)}</span>`;
    }

    function switchProject(proj) {
      state.project = proj;
      const projObj = PUB[proj];
      if (projObj && projObj.releases && projObj.releases.length > 0) {
        state.version = projObj.releases[0].version;
      }
      syncUrl();
      render();
    }

    function switchMode(mode) {
      state.mode = mode;
      syncUrl();
      render();
    }

    function selectVersion(ver) {
      state.version = ver;
      state.mode = 'releases';
      syncUrl();
      render();
    }

    function renderEditionStrip(projObj) {
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';
      const releases = projObj.releases || [];

      return `
        <button
          type="button"
          class="ver-btn"
          aria-current="${state.mode === 'weekly' ? 'true' : 'false'}"
          onclick="switchMode('weekly')"
        >
          This Week in ${projName}
        </button>
        <span class="strip-divider" aria-hidden="true"></span>
        <span class="strip-label">Releases:</span>
        ${releases.map(r => {
          const isSelected = state.mode === 'releases' && r.version === state.version;
          return `
            <button
              type="button"
              class="ver-btn"
              aria-current="${isSelected ? 'true' : 'false'}"
              onclick="selectVersion('${escapeHtml(r.version)}')"
            >
              <span translate="no">${escapeHtml(r.version)}</span>
            </button>
          `;
        }).join('')}
      `;
    }

    function renderReleaseView(projObj, rel) {
      const fp = rel.five_parts;
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';

      return `
        <article>
          <header class="article-header">
            <div class="article-byline">
              ${escapeHtml(rel.date)} &mdash; ${escapeHtml(rel.stats.replace(/\s*·\s*/g, ', '))}
            </div>
            <h1 class="article-title">What’s New in ${projName} ${escapeHtml(rel.version)}: ${escapeHtml(rel.headline)}</h1>
            <p class="article-standfirst">${formatProse(rel.executive_summary, state.project)}</p>
            <nav class="jump-nav" aria-label="Article sections">
              <span class="jump-label">Contents:</span>
              <a href="#whats-the-big-deal">What’s the big deal?</a>
              <a href="#who-benefits">Who benefits?</a>
              <a href="#jargon-glossary">What the jargon means</a>
              <a href="#should-i-upgrade">Should I upgrade?</a>
              <a href="#wheres-the-proof">Where’s the proof?</a>
            </nav>
          </header>

          <section class="doc-section" id="whats-the-big-deal">
            <h2>What’s the big deal?</h2>
            <p class="section-lead">The most consequential changes in ${projName} ${escapeHtml(rel.version)} and what they replace.</p>

            <div>
              ${fp.big_deal.map(item => {
                const toneClass = item.status_tone === 'amber'
                  ? 'stage-amber'
                  : (item.status_tone === 'cyan' ? 'stage-blue' : 'stage-green');
                return `
                  <div class="change-entry">
                    <div class="change-head">
                      <h3 class="change-title">${escapeHtml(item.title)}</h3>
                      <div class="change-refs">
                        <span class="stage-tag ${toneClass}">${escapeHtml(item.status)}</span>
                        ${(item.prs || []).map(p => formatRefLink(p, state.project)).join(' ')}
                      </div>
                    </div>
                    <p class="change-prose"><strong>Previously:</strong> ${formatProse(item.before, state.project)}</p>
                    <p class="change-prose"><strong>In ${escapeHtml(rel.version)}:</strong> ${formatProse(item.now, state.project)}</p>
                    ${item.config_snippet ? `<pre class="code-sample"><code translate="no">${escapeHtml(item.config_snippet)}</code></pre>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <section class="doc-section" id="who-benefits">
            <h2>Who benefits?</h2>
            <p class="section-lead">Which models, hardware fleets, and workloads see an immediate gain from ${escapeHtml(rel.version)}.</p>

            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th scope="col" style="width:23%;">Workload / Team</th>
                    <th scope="col" style="width:26%;">Models / Services</th>
                    <th scope="col" style="width:23%;">GPUs / Nodes</th>
                    <th scope="col" style="width:28%;">Practical Impact</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.who_benefits.map(w => `
                    <tr>
                      <td><strong>${escapeHtml(w.persona)}</strong></td>
                      <td>${formatProse(w.models, state.project)}</td>
                      <td>${formatProse(w.gpus, state.project)}</td>
                      <td>${formatProse(w.impact, state.project)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>

          <section class="doc-section" id="jargon-glossary">
            <h2>What does the jargon mean?</h2>
            <p class="section-lead">Plain-English definitions for the systems and inference terms that appear in this release.</p>

            <dl class="glossary-list">
              ${fp.jargon_decoded.map(j => `
                <div class="glossary-item">
                  <dt translate="no">${escapeHtml(j.term)}</dt>
                  <dd>
                    <div>${formatProse(j.plain_english, state.project)}</div>
                    <div class="glossary-why"><strong>Why it matters:</strong> ${formatProse(j.bottom_line, state.project)}</div>
                  </dd>
                </div>
              `).join('')}
            </dl>
          </section>

          <section class="doc-section" id="should-i-upgrade">
            <h2>Should I upgrade?</h2>
            <p class="section-lead">Breaking changes, deprecated flags, and configuration updates to check before rolling out ${escapeHtml(rel.version)}.</p>

            <div class="verdict-note">
              <strong>Bottom line:</strong> ${escapeHtml(fp.upgrade_guide.verdict)}
            </div>

            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th scope="col" style="width:26%;">Change</th>
                    <th scope="col" style="width:34%;">What Breaks or Changes</th>
                    <th scope="col" style="width:30%;">Required Action</th>
                    <th scope="col" style="width:10%;">PR / KEP</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.upgrade_guide.rows.map(r => `
                    <tr>
                      <td><strong>${formatProse(r.change, state.project)}</strong></td>
                      <td>${formatProse(r.impact, state.project)}</td>
                      <td>${formatProse(r.action, state.project)}</td>
                      <td class="num">${formatRefLink(r.pr, state.project)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>

          <section class="doc-section" id="wheres-the-proof">
            <h2>Where’s the proof?</h2>
            <p class="section-lead">Benchmarks and upstream pull requests with hardware and model conditions preserved.</p>

            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th scope="col" style="width:36%;">Benchmark / Capability</th>
                    <th scope="col" style="width:32%;">Hardware &amp; Workload Condition</th>
                    <th scope="col" style="width:22%;">Measured Gain</th>
                    <th scope="col" style="width:10%;">Source</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.proof_benchmarks.map(b => `
                    <tr>
                      <td><strong>${escapeHtml(b.label)}</strong></td>
                      <td>${escapeHtml(b.hardware)}</td>
                      <td class="num"><strong>${escapeHtml(b.metric)}</strong></td>
                      <td class="num">${formatRefLink(b.pr, state.project)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>
        </article>
      `;
    }

    function renderWeeklyView(projObj) {
      const w = projObj.weekly;

      return `
        <article>
          <header class="article-header">
            <div class="article-byline">
              ${escapeHtml(w.issue_number)} &mdash; ${escapeHtml(w.date_range)} (${escapeHtml(w.reading_time)})
            </div>
            <h1 class="article-title">${escapeHtml(w.headline)}</h1>
            <p class="article-standfirst">${escapeHtml(w.intro)}</p>
          </header>

          <section class="doc-section" id="weekly-highlights">
            <h2>Key takeaways this week</h2>
            <p class="section-lead">The three most consequential changes merged into main this week.</p>

            <div>
              ${w.tldr_cards.map(c => `
                <div class="change-entry">
                  <div class="change-head">
                    <h3 class="change-title">${escapeHtml(c.title)}</h3>
                    <div class="change-refs">
                      <span class="stage-tag stage-blue">${escapeHtml(c.tag)}</span>
                      ${(c.prs || []).map(p => formatRefLink(p, state.project)).join(' ')}
                    </div>
                  </div>
                  <p class="change-prose">${formatProse(c.summary, state.project)}</p>
                  <p class="change-prose"><strong>Why it matters:</strong> ${formatProse(c.impact, state.project)}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <section class="doc-section" id="weekly-featured">
            <h2>Featured pull requests</h2>
            <p class="section-lead">Plain-English breakdown of notable engineering merges.</p>

            <div>
              ${w.sections[0].items.map(it => `
                <div class="change-entry">
                  <div class="change-head">
                    <h3 class="change-title">${escapeHtml(it.title)}</h3>
                    <div class="change-refs">${formatRefLink(it.pr, state.project)}</div>
                  </div>
                  <p class="change-prose"><strong>What changed:</strong> ${formatProse(it.what_it_is, state.project)}</p>
                  <p class="change-prose"><strong>Why operators care:</strong> ${formatProse(it.why_you_care, state.project)}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <section class="doc-section" id="weekly-merges">
            <h2>${escapeHtml(w.sections[1].category)}</h2>
            <p class="section-lead">Compact summary of other merges across the repository.</p>
            <ul class="weekly-list">
              ${w.sections[1].bullets.map(b => `<li>${formatProse(b, state.project)}</li>`).join('')}
            </ul>
          </section>
        </article>
      `;
    }

    function render() {
      const projObj = PUB[state.project] || PUB.vllm;
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';

      document.getElementById('site-title').textContent = `What’s New in ${projName}`;
      document.getElementById('btn-proj-vllm').setAttribute('aria-pressed', state.project === 'vllm' ? 'true' : 'false');
      document.getElementById('btn-proj-k8s').setAttribute('aria-pressed', state.project === 'kubernetes' ? 'true' : 'false');

      const releases = projObj.releases || [];
      if (!releases.some(r => r.version === state.version) && releases.length > 0) {
        state.version = releases[0].version;
      }

      document.getElementById('edition-strip-inner').innerHTML = renderEditionStrip(projObj);

      const mainEl = document.getElementById('main-content');
      if (state.mode === 'releases') {
        const activeRel = releases.find(r => r.version === state.version) || releases[0];
        mainEl.innerHTML = renderReleaseView(projObj, activeRel);
      } else {
        mainEl.innerHTML = renderWeeklyView(projObj);
      }
    }

    readUrl();
    render();
  </script>
</body>
</html>

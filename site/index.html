<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's New in vLLM & Kubernetes — Adoption Decision Portal</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131b2e;
      --panel-alt: #182238;
      --border: #263454;
      --text: #e6edf7;
      --muted: #97a6c4;
      --accent: #4f8cff;
      --accent-soft: rgba(79, 140, 255, 0.14);
      --green: #2ecc71;
      --green-soft: rgba(46, 204, 113, 0.15);
      --amber: #f39c12;
      --amber-soft: rgba(243, 156, 18, 0.16);
      --red: #e74c3c;
      --red-soft: rgba(231, 76, 60, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    a { color: #7cb0ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      background: linear-gradient(180deg, #131d33 0%, #0e1525 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 28px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
      max-width: 880px;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: calc(100vh - 125px);
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: #0e1524;
      padding: 16px;
      overflow-y: auto;
    }
    .sidebar h3 {
      margin: 6px 0 12px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .ver-item {
      padding: 10px 12px;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
    }
    .ver-item:hover {
      background: var(--panel);
    }
    .ver-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .ver-name {
      font-weight: 600;
      font-size: 0.92rem;
    }
    .ver-meta {
      font-size: 0.76rem;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-pending_review { background: var(--amber-soft); color: #f8b84e; border: 1px solid rgba(243, 156, 18, 0.35); }
    .badge-approved { background: var(--green-soft); color: #58e690; border: 1px solid rgba(46, 204, 113, 0.35); }
    .badge-disapproved { background: var(--red-soft); color: #ff7b6e; border: 1px solid rgba(231, 76, 60, 0.35); }
    .main {
      padding: 24px 32px;
      max-width: 1180px;
    }
    .review-bar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .review-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .review-input {
      background: #0b101c;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 11px;
      border-radius: 6px;
      min-width: 240px;
      font-size: 0.85rem;
    }
    .btn {
      padding: 7px 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.83rem;
      color: #fff;
    }
    .btn-approve { background: #1e8449; border-color: #27ae60; }
    .btn-disapprove { background: #922b21; border-color: #c0392b; }
    .btn-reset { background: #2c3e50; border-color: #34495e; }
    .section-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .section-card h2 {
      margin-top: 0;
      font-size: 1.18rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      color: #9ec3ff;
    }
    .positioning-box {
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 0.95rem;
    }
    .verdict-box {
      background: var(--amber-soft);
      border-left: 4px solid var(--amber);
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.88rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--panel-alt);
      color: #b8ccf0;
      font-weight: 600;
    }
    .jargon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .jargon-card {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .jargon-term {
      font-weight: 700;
      color: #8ab8ff;
      margin-bottom: 4px;
    }
    .jargon-why {
      margin-top: 6px;
      font-size: 0.83rem;
      color: #8ce9b0;
    }
    .pulse-box {
      background: #0d1424;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      margin-top: 16px;
    }
    code {
      background: rgba(255,255,255,0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84em;
    }
    pre {
      background: #090d16;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <div class="brand-title">What's New in vLLM & Kubernetes — Adoption Decision Engine</div>
        <div class="brand-sub">
          Translating inference engine and cluster changes into adoption decisions for people who don't follow inference engineering full-time — what changed, and what it means for the models you serve, the GPUs you own, and your inference bill.
        </div>
      </div>
      <div id="queue-counters" style="font-size:0.85rem; color:var(--muted);"></div>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('vllm')">vLLM Releases &amp; Last Week in vLLM</button>
      <button class="tab-btn" onclick="switchTab('kubernetes')">Kubernetes Control Benchmark (v1.28–v1.37 + LWKD)</button>
      <button class="tab-btn" onclick="switchTab('ab_lab')">A/B Eval &amp; Hill-Climbing Lab</button>
      <button class="tab-btn" onclick="switchTab('review_queue')">Approval Queue &amp; Automation</button>
    </div>
  </header>

  <div class="layout" id="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main-content"></main>
  </div>

  <script src="data.js"></script>
  <script>
    let DATA = window.__RELEASE_TRANSLATOR_DATA__ || null;
    let currentTab = 'vllm';
    let selectedVersionIndex = 0;

    function formatLinks(text, project) {
      if (!text) return '';
      const repo = project === 'kubernetes' ? 'kubernetes/kubernetes' : 'vllm-project/vllm';
      let out = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/(?<![\/a-zA-Z0-9])#(\d{4,6})\b/g, `<a href="https://github.com/${repo}/pull/$1" target="_blank" rel="noopener">#$1</a>`);
      return out;
    }

    function getReviewItem(project, version) {
      if (!DATA || !DATA.review_queue || !DATA.review_queue.items) return { status: 'pending_review', reviewer_note: '' };
      const id = `${project}:${version}`;
      return DATA.review_queue.items.find(x => x.id === id) || { status: 'pending_review', reviewer_note: '' };
    }

    async function submitReview(project, version, status) {
      const id = `${project}:${version}`;
      const noteInput = document.getElementById('reviewer-note-input');
      const note = noteInput ? noteInput.value : '';
      try {
        const res = await fetch('/api/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status, note })
        });
        if (res.ok) {
          const payload = await res.json();
          DATA.review_queue = payload.review_queue;
          renderAll();
          return;
        }
      } catch (_e) {
        // Fallback for static file:// preview
      }
      const item = getReviewItem(project, version);
      item.status = status;
      item.reviewer_note = note;
      renderAll();
    }

    function switchTab(tab) {
      currentTab = tab;
      selectedVersionIndex = 0;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        const map = ['vllm', 'kubernetes', 'ab_lab', 'review_queue'];
        btn.classList.toggle('active', map[idx] === tab);
      });
      renderAll();
    }

    function selectVersion(idx) {
      selectedVersionIndex = idx;
      renderAll();
    }

    function renderCounters() {
      const el = document.getElementById('queue-counters');
      if (!DATA || !DATA.review_queue) return;
      const items = DATA.review_queue.items || [];
      const pending = items.filter(x => x.status === 'pending_review').length;
      const approved = items.filter(x => x.status === 'approved').length;
      const disapproved = items.filter(x => x.status === 'disapproved').length;
      el.innerHTML = `Queue: <span class="badge badge-approved">${approved} Approved</span> <span class="badge badge-pending_review">${pending} Pending Review</span> <span class="badge badge-disapproved">${disapproved} Disapproved</span>`;
    }

    function renderGuideView(list) {
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main-content');
      document.getElementById('app-layout').style.gridTemplateColumns = '310px 1fr';
      sidebar.style.display = 'block';

      const groupLabel = currentTab === 'vllm' ? 'vLLM Editions (Minor, Patch & Weekly)' : 'Kubernetes Control (10 Versions + LWKD)';
      let sbHtml = `<h3>${groupLabel}</h3>`;
      list.forEach((item, idx) => {
        const rev = getReviewItem(item.project, item.version);
        const label = item.display_title || item.version;
        const score = item.eval ? (item.eval.composite_score * 100).toFixed(1) + '%' : '';
        sbHtml += `
          <div class="ver-item ${idx === selectedVersionIndex ? 'active' : ''}" onclick="selectVersion(${idx})">
            <div>
              <div class="ver-name">${label}</div>
              <div class="ver-meta">${item.published_date || 'Release'} · Eval ${score}</div>
            </div>
            <span class="badge badge-${rev.status}">${rev.status.replace('_', ' ')}</span>
          </div>
        `;
      });
      sidebar.innerHTML = sbHtml;

      const guide = list[selectedVersionIndex];
      if (!guide) {
        main.innerHTML = '<p>No guides found.</p>';
        return;
      }
      const rev = getReviewItem(guide.project, guide.version);
      const secs = guide.sections || {};
      const evalObj = guide.eval || {};

      let html = `
        <div class="review-bar">
          <div>
            <strong>Review Gate:</strong> <code>${guide.project}:${guide.version}</code>
            <span class="badge badge-${rev.status}" style="margin-left:8px;">${rev.status}</span>
            <span style="margin-left:10px; font-size:0.84rem; color:var(--muted);">
              Composite Score: <strong>${((evalObj.composite_score || 0) * 100).toFixed(1)}%</strong>
              | Citation Precision: <strong>${((evalObj.factual_citation_precision || 1) * 100).toFixed(0)}%</strong>
            </span>
          </div>
          <div class="review-actions">
            <input id="reviewer-note-input" class="review-input" placeholder="Reviewer note (optional)..." value="${(rev.reviewer_note || '').replace(/"/g, '&quot;')}" />
            <button class="btn btn-approve" onclick="submitReview('${guide.project}', '${guide.version}', 'approved')">Approve</button>
            <button class="btn btn-disapprove" onclick="submitReview('${guide.project}', '${guide.version}', 'disapproved')">Disapprove</button>
            <button class="btn btn-reset" onclick="submitReview('${guide.project}', '${guide.version}', 'pending_review')">Reset</button>
          </div>
        </div>

        <h1 style="margin-top:0;">What's New in ${guide.project.toUpperCase()} ${guide.display_title || guide.version}</h1>
        <div class="positioning-box">
          <strong>Positioning:</strong> ${guide.positioning}
        </div>

        <div class="section-card">
          <h2>1. What's the Big Deal?</h2>
          <p style="color:var(--muted); margin-top:0;">Top capability clusters synthesized across ${guide.total_raw_items || 0} upstream changes:</p>
          <ol>
            ${(secs.whats_the_big_deal || []).map(b => `
              <li style="margin-bottom:14px;">
                <strong>${b.theme || b.category || 'Highlight'}</strong>
                ${(b.prs && b.prs.length) ? `<span style="color:var(--muted);">(${b.prs.slice(0,4).map(p => formatLinks('#'+p, guide.project)).join(', ')})</span>` : ''}
                <div style="margin-top:4px;"><em>What changed:</em> ${formatLinks(b.what_changed || b.text || '', guide.project)}</div>
                ${b.why_it_matters ? `<div style="margin-top:3px; color:#8ce9b0;"><em>Operational impact:</em> ${formatLinks(b.why_it_matters, guide.project)}</div>` : ''}
              </li>
            `).join('')}
          </ol>

          <div class="pulse-box">
            <h3 style="margin-top:0; font-size:0.96rem; color:#9ec3ff;">
              Last Week / Patch Pulse (${guide.project === 'kubernetes' ? 'LWKD' : 'Last Week in vLLM'} Style)
            </h3>
            <ul style="margin-bottom:0;">
              ${(secs.lwkd_patch_pulse || []).map(p => `<li>${formatLinks(p, guide.project)}</li>`).join('')}
            </ul>
          </div>
        </div>

        <div class="section-card">
          <h2>2. Who Benefits? (Models You Serve, GPUs You Own &amp; Your Bill)</h2>
          <table>
            <thead>
              <tr>
                <th>Capability Area</th>
                <th>Models / Workloads Served</th>
                <th>GPUs / Infrastructure Owned</th>
                <th>Impact on Your Bill &amp; SLAs</th>
              </tr>
            </thead>
            <tbody>
              ${(secs.who_benefits || []).map(w => `
                <tr>
                  <td><strong>${w.capability || 'Core'}</strong></td>
                  <td>${formatLinks(w.models_workloads || '', guide.project)}</td>
                  <td>${formatLinks(w.gpus_infra || '', guide.project)}</td>
                  <td>${formatLinks(w.bill_impact || '', guide.project)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <div class="section-card">
          <h2>3. What Does the Jargon Mean?</h2>
          <div class="jargon-grid">
            ${(secs.jargon_glossary || []).map(j => `
              <div class="jargon-card">
                <div class="jargon-term">${j.term}</div>
                <div style="font-size:0.86rem;">${formatLinks(j.meaning, guide.project)}</div>
                <div class="jargon-why"><strong>Why you care:</strong> ${formatLinks(j.why_it_matters, guide.project)}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="section-card">
          <h2>4. Should I Upgrade?</h2>
          <div class="verdict-box">${guide.verdict || 'Review upgrade notes before rollout'}</div>
          <ul>
            ${(secs.should_i_upgrade || []).map(u => `
              <li style="margin-bottom:8px;">
                <strong>[${u.category || 'Upgrade Check'}]</strong> ${formatLinks(u.text || '', guide.project)}
              </li>
            `).join('')}
          </ul>
        </div>

        <div class="section-card">
          <h2>5. Where's the Proof?</h2>
          <ul>
            ${(secs.wheres_the_proof || []).map(p => `
              <li style="margin-bottom:8px;">
                <strong>[${p.category || 'Proof'}]</strong> ${formatLinks(p.text || '', guide.project)}
                ${(p.prs && p.prs.length) ? `(${p.prs.slice(0,3).map(pr => formatLinks('#'+pr, guide.project)).join(', ')})` : ''}
              </li>
            `).join('')}
          </ul>
          <details style="margin-top:16px;">
            <summary style="cursor:pointer; color:#8ab8ff; font-weight:600;">View Complete Generated Markdown Brief (with Full Graduation Rollup)</summary>
            <pre>${(guide.markdown || '').replace(/</g, '&lt;')}</pre>
          </details>
        </div>
      `;
      main.innerHTML = html;
    }

    function renderAbLab() {
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main-content');
      sidebar.style.display = 'none';
      document.getElementById('app-layout').style.gridTemplateColumns = '1fr';

      const ab = (DATA && DATA.ab_eval_summary) || {};
      const k8s = ab.kubernetes_control_ab || {};
      const vllm = ab.vllm_target_ab || {};
      const comp = (ab.domain_comparison_k8s_vs_vllm || {}).key_structural_differences_and_transfer_lessons || [];
      const variants = Object.keys(k8s);

      const renderTable = (domainObj) => `
        <table>
          <thead>
            <tr>
              <th>Generator Architecture</th>
              <th>Headline Salience Recall</th>
              <th>Upgrade Risk Recall</th>
              <th>Citation Precision</th>
              <th>5-Part Completeness</th>
              <th>Jargon Translation</th>
              <th>Cluster Diversity</th>
              <th>Composite Score</th>
            </tr>
          </thead>
          <tbody>
            ${variants.map(v => {
              const r = domainObj[v] || {};
              const isBest = v === 'v4_adoption_engine';
              return `
                <tr style="${isBest ? 'background:rgba(46,204,113,0.10); font-weight:600;' : ''}">
                  <td><code>${v}</code> ${isBest ? '★ Winner' : ''}</td>
                  <td>${((r.headline_salience_recall || 0)*100).toFixed(1)}%</td>
                  <td>${((r.upgrade_risk_recall || 0)*100).toFixed(1)}%</td>
                  <td>${((r.factual_citation_precision || 0)*100).toFixed(1)}%</td>
                  <td>${((r.five_part_completeness || 0)*100).toFixed(1)}%</td>
                  <td>${((r.jargon_translation_score || 0)*100).toFixed(1)}%</td>
                  <td>${((r.cluster_diversity_score || 0)*100).toFixed(1)}%</td>
                  <td><strong>${((r.composite_score || 0)*100).toFixed(1)}%</strong></td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;

      main.innerHTML = `
        <h1 style="margin-top:0;">A/B Evaluation &amp; Auto-Research Hill-Climbing Lab</h1>
        <p style="color:var(--muted);">
          Using 10 Kubernetes minor releases (<code>v1.28</code>–<code>v1.37</code>, 3,088 raw changelog items) + 47 patch releases + 5 LWKD weekly digests as our ground-truth control benchmark, we hill-climbed from <code>v0_naive_baseline</code> (32.4%) to <code>v4_adoption_engine</code> (95.8%) before transferring the winning architecture to 10 vLLM releases (<code>v0.25.0</code>–<code>v0.34.0</code>, 99.6%).
        </p>

        <div class="section-card">
          <h2>1. Kubernetes Control Benchmark (10 Minor Releases: v1.28 – v1.37)</h2>
          ${renderTable(k8s)}
        </div>

        <div class="section-card">
          <h2>2. vLLM Target Benchmark (10 Minor Releases: v0.25.0 – v0.34.0)</h2>
          ${renderTable(vllm)}
        </div>

        <div class="section-card">
          <h2>3. Structural Comparison: Why vLLM Needs Domain Calibration Beyond Kubernetes</h2>
          <table>
            <thead>
              <tr>
                <th>Dimension</th>
                <th>Kubernetes (v1.28–v1.37)</th>
                <th>vLLM (v0.25.0–v0.34.0)</th>
                <th>Architectural Adaptation in <code>v4_adoption_engine</code></th>
              </tr>
            </thead>
            <tbody>
              ${comp.map(d => `
                <tr>
                  <td><strong>${d.dimension}</strong></td>
                  <td>${d.kubernetes}</td>
                  <td>${d.vllm}</td>
                  <td>${d.adaptation_in_v3}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderReviewQueueTab() {
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main-content');
      sidebar.style.display = 'none';
      document.getElementById('app-layout').style.gridTemplateColumns = '1fr';

      const items = (DATA && DATA.review_queue && DATA.review_queue.items) || [];
      main.innerHTML = `
        <h1 style="margin-top:0;">Human-in-the-Loop Approval Queue &amp; Watcher Automation</h1>
        <p style="color:var(--muted);">
          The scheduled timer (<code>python3 -m harness.cli watch --interval 3600</code>) polls upstream releases and weekly merged PRs, runs the <code>v4_adoption_engine</code> + evaluation gate (<code>&gt;= 82%</code> composite score), and places new drafts in <code>pending_review</code>.
        </p>
        <div class="section-card">
          <h2>All Generated Release &amp; Weekly Briefs (${items.length})</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Project</th>
                <th>Edition / Version</th>
                <th>Eval Gate Score</th>
                <th>Current Status</th>
                <th>Reviewer Note</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(it => `
                <tr>
                  <td><code>${it.id}</code></td>
                  <td>${it.project.toUpperCase()}</td>
                  <td><strong>${it.version}</strong></td>
                  <td>${((it.composite_score || 0)*100).toFixed(1)}%</td>
                  <td><span class="badge badge-${it.status}">${it.status}</span></td>
                  <td>${it.reviewer_note || '—'}</td>
                  <td>
                    <button class="btn btn-approve" onclick="submitReview('${it.project}', '${it.version}', 'approved')">Approve</button>
                    <button class="btn btn-disapprove" onclick="submitReview('${it.project}', '${it.version}', 'disapproved')">Disapprove</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderAll() {
      renderCounters();
      if (!DATA) return;
      if (currentTab === 'vllm') {
        renderGuideView(DATA.vllm_guides || []);
      } else if (currentTab === 'kubernetes') {
        renderGuideView(DATA.kubernetes_guides || []);
      } else if (currentTab === 'ab_lab') {
        renderAbLab();
      } else {
        renderReviewQueueTab();
      }
    }

    renderAll();
  </script>
</body>
</html>

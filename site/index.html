<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
  <title>What’s New in vLLM &amp; Kubernetes</title>
  <style>
    :root,
    html[data-theme="light"] {
      color-scheme: light;
      --bs-body-bg: #ffffff;
      --bs-body-color: #212529;
      --bs-secondary-color: #495057;
      --bs-muted-color: #6c757d;
      --bs-tertiary-bg: #f8f9fa;
      --bs-border-color: #dee2e6;
      --bs-border-strong: #ced4da;
      --bs-primary: #0d6efd;
      --bs-primary-hover: #0a58ca;
      --bs-primary-subtle: #cfe2ff;
      --bs-primary-text: #084298;
      --bs-success-bg: #d1e7dd;
      --bs-success-text: #0f5132;
      --bs-warning-bg: #fff3cd;
      --bs-warning-text: #664d03;
      --bs-warning-border: #ffecb5;
      --bs-code-bg: #f8f9fa;
      --bs-font-sans-serif: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
      --bs-font-monospace: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bs-body-bg: #0d1117;
      --bs-body-color: #e6edf3;
      --bs-secondary-color: #b1bac4;
      --bs-muted-color: #8b949e;
      --bs-tertiary-bg: #161b22;
      --bs-border-color: #30363d;
      --bs-border-strong: #484f58;
      --bs-primary: #58a6ff;
      --bs-primary-hover: #79c0ff;
      --bs-primary-subtle: rgba(56, 139, 253, 0.18);
      --bs-primary-text: #79c0ff;
      --bs-success-bg: rgba(46, 160, 67, 0.2);
      --bs-success-text: #56d364;
      --bs-warning-bg: rgba(187, 128, 9, 0.18);
      --bs-warning-text: #e3b341;
      --bs-warning-border: rgba(187, 128, 9, 0.4);
      --bs-code-bg: #161b22;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      font-family: var(--bs-font-sans-serif);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .skip-link {
      position: absolute;
      top: -48px;
      left: 16px;
      background: var(--bs-primary);
      color: #ffffff;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 0.375rem;
      z-index: 100;
      text-decoration: none;
    }
    .skip-link:focus-visible {
      top: 10px;
      outline: 2px solid var(--bs-body-color);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    a {
      color: var(--bs-primary);
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }
    a:hover {
      color: var(--bs-primary-hover);
    }

    button, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--bs-primary);
      outline-offset: 2px;
    }

    h1, h2, h3, h4 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-family: var(--bs-font-sans-serif);
      font-weight: 700;
      line-height: 1.25;
      color: var(--bs-body-color);
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    /* BOOTSTRAP-STYLE NAVBAR */
    .navbar {
      background-color: var(--bs-tertiary-bg);
      border-bottom: 1px solid var(--bs-border-color);
      padding: 0.65rem 1rem;
    }

    .navbar-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .navbar-brand {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--bs-body-color);
      letter-spacing: -0.01em;
    }

    .btn-group {
      display: inline-flex;
      border: 1px solid var(--bs-border-strong);
      border-radius: 0.375rem;
      overflow: hidden;
      background-color: var(--bs-body-bg);
    }

    .btn-seg {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--bs-secondary-color);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
    }
    .btn-seg + .btn-seg {
      border-left: 1px solid var(--bs-border-strong);
    }
    .btn-seg:hover {
      background-color: var(--bs-tertiary-bg);
      color: var(--bs-body-color);
    }
    .btn-seg[aria-pressed="true"] {
      background-color: var(--bs-primary);
      color: #ffffff;
      font-weight: 600;
    }
    html[data-theme="dark"] .btn-seg[aria-pressed="true"] {
      color: #0d1117;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .form-select {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border: 1px solid var(--bs-border-strong);
      border-radius: 0.375rem;
      padding: 0.32rem 0.65rem;
      font-size: 0.85rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .btn-theme {
      appearance: none;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border: 1px solid var(--bs-border-strong);
      border-radius: 0.375rem;
      padding: 0.32rem 0.7rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn-theme:hover {
      background-color: var(--bs-tertiary-bg);
    }

    /* COMPACT VERSION PILL BAR */
    .subnav {
      border-bottom: 1px solid var(--bs-border-color);
      background-color: var(--bs-body-bg);
      padding: 0.5rem 1rem;
    }

    .subnav-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .subnav-container::-webkit-scrollbar {
      display: none;
    }

    .subnav-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--bs-muted-color);
      margin-right: 0.2rem;
      white-space: nowrap;
    }

    .subnav-divider {
      width: 1px;
      height: 1.1rem;
      background-color: var(--bs-border-color);
      margin: 0 0.25rem;
      flex-shrink: 0;
    }

    .nav-pill {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--bs-secondary-color);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.22rem 0.6rem;
      border-radius: 0.375rem;
      cursor: pointer;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .nav-pill:hover {
      background-color: var(--bs-tertiary-bg);
      border-color: var(--bs-border-color);
      color: var(--bs-body-color);
    }
    .nav-pill[aria-current="true"] {
      background-color: var(--bs-primary-subtle);
      color: var(--bs-primary-text);
      border-color: var(--bs-primary);
      font-weight: 600;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem 5rem;
    }

    /* PAGE HEADER */
    .page-header {
      padding-bottom: 1.25rem;
      margin-bottom: 1.75rem;
      border-bottom: 1px solid var(--bs-border-color);
    }

    .page-meta {
      font-size: 0.875rem;
      color: var(--bs-muted-color);
      margin-bottom: 0.4rem;
      font-variant-numeric: tabular-nums;
    }

    .page-title {
      font-size: clamp(1.6rem, 3vw, 2.15rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .lead {
      font-size: 1.05rem;
      color: var(--bs-secondary-color);
      margin: 0;
      line-height: 1.65;
    }

    /* SECTIONS */
    .section-block {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--bs-border-color);
    }
    .section-block:last-child {
      border-bottom: none;
    }

    .section-block h2 {
      font-size: 1.3rem;
      margin-bottom: 0.25rem;
    }

    .section-subtitle {
      font-size: 0.92rem;
      color: var(--bs-muted-color);
      margin: 0 0 1.25rem 0;
    }

    /* PART 1 ITEMS */
    .feature-item + .feature-item {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--bs-border-color);
    }

    .feature-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    .feature-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
    }

    .feature-meta {
      font-family: var(--bs-font-monospace);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .badge {
      font-family: var(--bs-font-sans-serif);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.18rem 0.5rem;
      border-radius: 0.25rem;
    }
    .badge-success {
      background-color: var(--bs-success-bg);
      color: var(--bs-success-text);
    }
    .badge-warning {
      background-color: var(--bs-warning-bg);
      color: var(--bs-warning-text);
    }
    .badge-primary {
      background-color: var(--bs-primary-subtle);
      color: var(--bs-primary-text);
    }

    .feature-p {
      margin: 0 0 0.5rem 0;
      font-size: 0.95rem;
      color: var(--bs-secondary-color);
    }
    .feature-p strong {
      color: var(--bs-body-color);
    }

    pre.code-box {
      margin: 0.75rem 0 0 0;
      background-color: var(--bs-code-bg);
      border: 1px solid var(--bs-border-color);
      border-radius: 0.375rem;
      padding: 0.75rem 1rem;
      font-family: var(--bs-font-monospace);
      font-size: 0.8125rem;
      line-height: 1.5;
      color: var(--bs-body-color);
      overflow-x: auto;
    }

    /* BOOTSTRAP TABLES */
    .table-responsive {
      overflow-x: auto;
      border: 1px solid var(--bs-border-color);
      border-radius: 0.375rem;
    }

    table.table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      margin: 0;
    }

    .table th,
    .table td {
      padding: 0.65rem 0.85rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--bs-border-color);
    }

    .table tbody tr:last-child td {
      border-bottom: none;
    }

    .table th {
      background-color: var(--bs-tertiary-bg);
      font-weight: 600;
      color: var(--bs-body-color);
      font-size: 0.82rem;
    }

    /* JARGON LIST */
    dl.jargon-dl {
      margin: 0;
      display: grid;
      gap: 1rem;
    }

    .jargon-row {
      padding: 0.75rem 1rem;
      background-color: var(--bs-tertiary-bg);
      border: 1px solid var(--bs-border-color);
      border-radius: 0.375rem;
    }

    .jargon-row dt {
      font-family: var(--bs-font-monospace);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--bs-body-color);
      margin-bottom: 0.25rem;
    }

    .jargon-row dd {
      margin: 0;
      font-size: 0.92rem;
      color: var(--bs-secondary-color);
    }

    /* ALERT BOX */
    .alert-warning {
      background-color: var(--bs-warning-bg);
      color: var(--bs-warning-text);
      border: 1px solid var(--bs-warning-border);
      border-radius: 0.375rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }

    code {
      font-family: var(--bs-font-monospace);
      font-size: 0.85em;
      background-color: var(--bs-code-bg);
      border: 1px solid var(--bs-border-color);
      padding: 0.1rem 0.3rem;
      border-radius: 0.25rem;
      color: var(--bs-body-color);
    }
    pre code {
      background: none;
      border: none;
      padding: 0;
    }

    .merge-list {
      margin: 0;
      padding-left: 1.25rem;
      display: grid;
      gap: 0.5rem;
      font-size: 0.94rem;
      color: var(--bs-secondary-color);
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="navbar-container">
      <div class="navbar-left">
        <span class="navbar-brand" id="navbar-brand">What’s New in vLLM</span>
        <div class="btn-group" role="group" aria-label="Select project">
          <button type="button" class="btn-seg" id="btn-proj-vllm" onclick="switchProject('vllm')" aria-pressed="true">
            vLLM
          </button>
          <button type="button" class="btn-seg" id="btn-proj-k8s" onclick="switchProject('kubernetes')" aria-pressed="false">
            Kubernetes
          </button>
        </div>
      </div>

      <div class="navbar-right">
        <label for="edition-select" class="sr-only">Jump to version or weekly digest</label>
        <select id="edition-select" class="form-select" onchange="handleSelectChange(this.value)"></select>

        <button type="button" class="btn-theme" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle light or dark theme">
          <span id="theme-toggle-label">Dark mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- QUICK EDITION STRIP (MINOR, PATCH, AND WEEKLY YYYY-MM-DD) -->
  <nav class="subnav" aria-label="Release and weekly editions">
    <div class="subnav-container" id="subnav-container"></div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="container" id="main-content" tabindex="-1"></main>

  <script src="publication_data.js"></script>
  <script>
    const PUB = window.__PUBLICATION_DATA__ || {};

    let state = {
      project: 'vllm',
      mode: 'releases', // 'releases' | 'weekly'
      version: 'v0.34.0',
      theme: localStorage.getItem('release_theme') || 'light'
    };

    function applyTheme(theme) {
      state.theme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', state.theme);
      localStorage.setItem('release_theme', state.theme);
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) {
        metaTheme.setAttribute('content', state.theme === 'dark' ? '#0d1117' : '#ffffff');
      }
      const lbl = document.getElementById('theme-toggle-label');
      if (lbl) {
        lbl.textContent = state.theme === 'dark' ? 'Light mode' : 'Dark mode';
      }
    }

    function toggleTheme() {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    }

    function readUrl() {
      const p = new URLSearchParams(window.location.search);
      const proj = p.get('project');
      if (proj === 'vllm' || proj === 'kubernetes') state.project = proj;
      const mode = p.get('mode');
      if (mode === 'releases' || mode === 'weekly') state.mode = mode;
      const ver = p.get('ver');
      if (ver) state.version = ver;
    }

    function syncUrl() {
      const p = new URLSearchParams();
      p.set('project', state.project);
      p.set('mode', state.mode);
      if (state.mode === 'releases') p.set('ver', state.version);
      window.history.replaceState(null, '', `${window.location.pathname}?${p.toString()}`);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatProse(str, project) {
      if (!str) return '';
      const repo = project === 'kubernetes' ? 'kubernetes/kubernetes' : 'vllm-project/vllm';
      let out = escapeHtml(str);
      out = out.replace(/`([^`]+)`/g, '<code translate="no">$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
      out = out.replace(/(?<![\/a-zA-Z0-9])#(\d{4,6})\b/g, `<a class="num" href="https://github.com/${repo}/pull/$1" target="_blank" rel="noopener">#$1</a>`);
      out = out.replace(/\bKEP-(\d{3,5})\b/gi, '<a class="num" href="https://github.com/kubernetes/enhancements/issues/$1" target="_blank" rel="noopener">KEP-$1</a>');
      return out;
    }

    function formatRefLink(ref, project) {
      const repo = project === 'kubernetes' ? 'kubernetes/kubernetes' : 'vllm-project/vllm';
      if (String(ref).toUpperCase().startsWith('KEP-')) {
        const num = ref.replace(/[^0-9]/g, '');
        return `<a class="num" href="https://github.com/kubernetes/enhancements/issues/${num}" target="_blank" rel="noopener">${escapeHtml(ref)}</a>`;
      }
      const num = String(ref).replace('#', '');
      if (/^\d+$/.test(num)) {
        return `<a class="num" href="https://github.com/${repo}/pull/${num}" target="_blank" rel="noopener">#${escapeHtml(num)}</a>`;
      }
      return `<span class="num">${escapeHtml(ref)}</span>`;
    }

    function switchProject(proj) {
      state.project = proj;
      const projObj = PUB[proj];
      if (projObj && projObj.releases && projObj.releases.length > 0) {
        state.version = projObj.releases[0].version;
      }
      syncUrl();
      render();
    }

    function selectVersion(ver) {
      state.mode = 'releases';
      state.version = ver;
      syncUrl();
      render();
    }

    function selectWeekly() {
      state.mode = 'weekly';
      syncUrl();
      render();
    }

    function handleSelectChange(val) {
      if (val === 'weekly') {
        selectWeekly();
      } else {
        selectVersion(val);
      }
    }

    function renderNavigation(projObj) {
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';
      const releases = projObj.releases || [];
      const minorReleases = releases.filter(r => r.kind !== 'patch');
      const patchReleases = releases.filter(r => r.kind === 'patch');
      const weeklyDate = (projObj.weekly && projObj.weekly.date_iso) || '2026-11-19';

      // Populate <select> dropdown with Minor, Patch, and Weekly (YYYY-MM-DD)
      const selectEl = document.getElementById('edition-select');
      selectEl.innerHTML = `
        <optgroup label="Minor Releases">
          ${minorReleases.map(r => `
            <option value="${escapeHtml(r.version)}" ${state.mode === 'releases' && state.version === r.version ? 'selected' : ''}>
              ${escapeHtml(r.version)} (${escapeHtml(r.date)})
            </option>
          `).join('')}
        </optgroup>
        <optgroup label="Patch Releases">
          ${patchReleases.map(r => `
            <option value="${escapeHtml(r.version)}" ${state.mode === 'releases' && state.version === r.version ? 'selected' : ''}>
              ${escapeHtml(r.version)} (${escapeHtml(r.date)})
            </option>
          `).join('')}
        </optgroup>
        <optgroup label="Weekly Digest (Thursdays)">
          <option value="weekly" ${state.mode === 'weekly' ? 'selected' : ''}>
            ${escapeHtml(weeklyDate)} — This Week in ${projName}
          </option>
        </optgroup>
      `;

      // Populate quick horizontal pill strip (fits Weekly + recent Minor + Patch without scrolling)
      const subnav = document.getElementById('subnav-container');
      subnav.innerHTML = `
        <span class="subnav-label">Weekly:</span>
        <button
          type="button"
          class="nav-pill"
          aria-current="${state.mode === 'weekly' ? 'true' : 'false'}"
          onclick="selectWeekly()"
        >
          ${escapeHtml(weeklyDate)} (Thu)
        </button>
        <span class="subnav-divider" aria-hidden="true"></span>
        <span class="subnav-label">Minor:</span>
        ${minorReleases.slice(0, 4).map(r => `
          <button
            type="button"
            class="nav-pill"
            aria-current="${state.mode === 'releases' && state.version === r.version ? 'true' : 'false'}"
            onclick="selectVersion('${escapeHtml(r.version)}')"
          >
            <span translate="no">${escapeHtml(r.version)}</span>
          </button>
        `).join('')}
        <span class="subnav-divider" aria-hidden="true"></span>
        <span class="subnav-label">Patch:</span>
        ${patchReleases.slice(0, 2).map(r => `
          <button
            type="button"
            class="nav-pill"
            aria-current="${state.mode === 'releases' && state.version === r.version ? 'true' : 'false'}"
            onclick="selectVersion('${escapeHtml(r.version)}')"
          >
            <span translate="no">${escapeHtml(r.version)}</span>
          </button>
        `).join('')}
      `;
    }

    function renderReleaseView(projObj, rel) {
      const fp = rel.five_parts;
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';
      const kindLabel = rel.kind === 'patch' ? 'Patch Release' : 'Minor Release';

      return `
        <article>
          <header class="page-header">
            <div class="page-meta">
              ${escapeHtml(kindLabel)} &middot; Released ${escapeHtml(rel.date)} &middot; ${escapeHtml(rel.stats)}
            </div>
            <h1 class="page-title">What’s New in ${projName} ${escapeHtml(rel.version)}: ${escapeHtml(rel.headline)}</h1>
            <p class="lead">${formatProse(rel.executive_summary, state.project)}</p>
          </header>

          <section class="section-block" id="whats-the-big-deal">
            <h2>1. What’s the big deal?</h2>
            <p class="section-subtitle">The headline changes in ${projName} ${escapeHtml(rel.version)} and what they replace.</p>

            <div>
              ${fp.big_deal.map(item => {
                const badgeClass = item.status_tone === 'amber'
                  ? 'badge-warning'
                  : (item.status_tone === 'cyan' ? 'badge-primary' : 'badge-success');
                return `
                  <div class="feature-item">
                    <div class="feature-header">
                      <h3 class="feature-title">${escapeHtml(item.title)}</h3>
                      <div class="feature-meta">
                        <span class="badge ${badgeClass}">${escapeHtml(item.status)}</span>
                        ${(item.prs || []).map(p => formatRefLink(p, state.project)).join(' ')}
                      </div>
                    </div>
                    <p class="feature-p"><strong>Previously:</strong> ${formatProse(item.before, state.project)}</p>
                    <p class="feature-p"><strong>Now in ${escapeHtml(rel.version)}:</strong> ${formatProse(item.now, state.project)}</p>
                    ${item.config_snippet ? `<pre class="code-box"><code translate="no">${escapeHtml(item.config_snippet)}</code></pre>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <section class="section-block" id="who-benefits">
            <h2>2. Who benefits? (Models, GPUs &amp; Your Bill)</h2>
            <p class="section-subtitle">Which models, hardware fleets, and workloads benefit from ${escapeHtml(rel.version)}.</p>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col" style="width:23%;">Workload / Team</th>
                    <th scope="col" style="width:26%;">Models / Services</th>
                    <th scope="col" style="width:23%;">GPUs / Nodes</th>
                    <th scope="col" style="width:28%;">Impact on Bill &amp; Latency</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.who_benefits.map(w => `
                    <tr>
                      <td><strong>${escapeHtml(w.persona)}</strong></td>
                      <td>${formatProse(w.models, state.project)}</td>
                      <td>${formatProse(w.gpus, state.project)}</td>
                      <td>${formatProse(w.impact, state.project)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>

          <section class="section-block" id="jargon-glossary">
            <h2>3. What does the jargon mean?</h2>
            <p class="section-subtitle">Plain-English definitions for the systems and inference terms in this release.</p>

            <dl class="jargon-dl">
              ${fp.jargon_decoded.map(j => `
                <div class="jargon-row">
                  <dt translate="no">${escapeHtml(j.term)}</dt>
                  <dd>
                    <div>${formatProse(j.plain_english, state.project)}</div>
                    <div style="margin-top:0.3rem;"><strong>Why it matters:</strong> ${formatProse(j.bottom_line, state.project)}</div>
                  </dd>
                </div>
              `).join('')}
            </dl>
          </section>

          <section class="section-block" id="should-i-upgrade">
            <h2>4. Should I upgrade?</h2>
            <p class="section-subtitle">Breaking changes, deprecated flags, and configuration updates to check before upgrading.</p>

            <div class="alert-warning">
              <strong>Verdict:</strong> ${escapeHtml(fp.upgrade_guide.verdict)}
            </div>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col" style="width:26%;">Change</th>
                    <th scope="col" style="width:34%;">What Breaks or Changes</th>
                    <th scope="col" style="width:30%;">Required Action</th>
                    <th scope="col" style="width:10%;">PR / KEP</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.upgrade_guide.rows.map(r => `
                    <tr>
                      <td><strong>${formatProse(r.change, state.project)}</strong></td>
                      <td>${formatProse(r.impact, state.project)}</td>
                      <td>${formatProse(r.action, state.project)}</td>
                      <td class="num">${formatRefLink(r.pr, state.project)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>

          <section class="section-block" id="wheres-the-proof">
            <h2>5. Where’s the proof?</h2>
            <p class="section-subtitle">Benchmarks and upstream pull requests with hardware and model conditions preserved.</p>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col" style="width:36%;">Benchmark / Capability</th>
                    <th scope="col" style="width:32%;">Hardware &amp; Workload Condition</th>
                    <th scope="col" style="width:22%;">Measured Gain</th>
                    <th scope="col" style="width:10%;">Source</th>
                  </tr>
                </thead>
                <tbody>
                  ${fp.proof_benchmarks.map(b => `
                    <tr>
                      <td><strong>${escapeHtml(b.label)}</strong></td>
                      <td>${escapeHtml(b.hardware)}</td>
                      <td class="num"><strong>${escapeHtml(b.metric)}</strong></td>
                      <td class="num">${formatRefLink(b.pr, state.project)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>
        </article>
      `;
    }

    function renderWeeklyView(projObj) {
      const w = projObj.weekly;

      return `
        <article>
          <header class="page-header">
            <div class="page-meta">
              Published ${escapeHtml(w.date_range)} &middot; ${escapeHtml(w.reading_time)}
            </div>
            <h1 class="page-title">${escapeHtml(w.headline)}</h1>
            <p class="lead">${escapeHtml(w.intro)}</p>
          </header>

          <section class="section-block">
            <h2>Key takeaways (${escapeHtml(w.date_iso || '2026-11-19')})</h2>
            <p class="section-subtitle">The three most consequential changes merged into main this week.</p>

            <div>
              ${w.tldr_cards.map(c => `
                <div class="feature-item">
                  <div class="feature-header">
                    <h3 class="feature-title">${escapeHtml(c.title)}</h3>
                    <div class="feature-meta">
                      <span class="badge badge-primary">${escapeHtml(c.tag)}</span>
                      ${(c.prs || []).map(p => formatRefLink(p, state.project)).join(' ')}
                    </div>
                  </div>
                  <p class="feature-p">${formatProse(c.summary, state.project)}</p>
                  <p class="feature-p"><strong>Why it matters:</strong> ${formatProse(c.impact, state.project)}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <section class="section-block">
            <h2>Featured pull requests</h2>
            <p class="section-subtitle">Plain-English breakdown of notable engineering merges.</p>

            <div>
              ${w.sections[0].items.map(it => `
                <div class="feature-item">
                  <div class="feature-header">
                    <h3 class="feature-title">${escapeHtml(it.title)}</h3>
                    <div class="feature-meta">${formatRefLink(it.pr, state.project)}</div>
                  </div>
                  <p class="feature-p"><strong>What changed:</strong> ${formatProse(it.what_it_is, state.project)}</p>
                  <p class="feature-p"><strong>Why operators care:</strong> ${formatProse(it.why_you_care, state.project)}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <section class="section-block">
            <h2>${escapeHtml(w.sections[1].category)}</h2>
            <p class="section-subtitle">Other notable merges from this week.</p>
            <ul class="merge-list">
              ${w.sections[1].bullets.map(b => `<li>${formatProse(b, state.project)}</li>`).join('')}
            </ul>
          </section>
        </article>
      `;
    }

    function render() {
      const projObj = PUB[state.project] || PUB.vllm;
      const projName = state.project === 'vllm' ? 'vLLM' : 'Kubernetes';

      document.getElementById('navbar-brand').textContent = `What’s New in ${projName}`;
      document.getElementById('btn-proj-vllm').setAttribute('aria-pressed', state.project === 'vllm' ? 'true' : 'false');
      document.getElementById('btn-proj-k8s').setAttribute('aria-pressed', state.project === 'kubernetes' ? 'true' : 'false');

      const releases = projObj.releases || [];
      if (!releases.some(r => r.version === state.version) && releases.length > 0) {
        state.version = releases[0].version;
      }

      renderNavigation(projObj);

      const mainEl = document.getElementById('main-content');
      if (state.mode === 'releases') {
        const activeRel = releases.find(r => r.version === state.version) || releases[0];
        mainEl.innerHTML = renderReleaseView(projObj, activeRel);
      } else {
        mainEl.innerHTML = renderWeeklyView(projObj);
      }
    }

    readUrl();
    applyTheme(state.theme);
    render();
  </script>
</body>
</html>
